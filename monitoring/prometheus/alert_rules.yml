groups:
  - name: container_alerts
    rules:
      - alert: ContainerHighCpuUsage
        expr: (sum(rate(container_cpu_usage_seconds_total{name!=""}[5m])) by (name) * 100) > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Container High CPU usage ({{ $labels.name }})"
          description: "Container {{ $labels.name }} CPU usage is above 90% for 5 minutes (current value: {{ $value | humanize }}%)."

      - alert: ContainerHighMemoryUsage
        expr: (container_memory_usage_bytes{name!=""} / container_spec_memory_limit_bytes{name!=""} * 100) > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Container High Memory usage ({{ $labels.name }})"
          description: "Container {{ $labels.name }} memory usage is above 90% for 5 minutes (current value: {{ $value | humanize }}%)."

      - alert: ContainerDown
        expr: absent(container_last_seen{name!=""}) or time() - container_last_seen{name!=""} > 60
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Container down ({{ $labels.name }})"
          description: "Container {{ $labels.name }} has been down for more than 1 minute."
