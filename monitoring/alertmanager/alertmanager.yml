global:
  smtp_smarthost: '${SMTP_HOST}:${SMTP_PORT}'
  smtp_from: 'alerts@proxysock.com'
  smtp_auth_username: '${SMTP_USERNAME}'
  smtp_auth_password: '${SMTP_PASSWORD}'
  smtp_require_tls: true

route:
  receiver: 'admin-email'
  group_by: ['alertname', 'container_label_com_docker_compose_service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: 'admin-email'
    email_configs:
      - to: '${ADMIN_ALERT_EMAIL}'
        send_resolved: true
        html: |
          <h2>Container Alert: {{ .Status | toUpper }}</h2>
          {{ range .Alerts }}
            <div style="margin-bottom: 20px; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
              <strong>Alert:</strong> {{ .Labels.alertname }}<br>
              <strong>Container:</strong> {{ .Labels.name }}<br>
              <strong>Severity:</strong> {{ .Labels.severity }}<br>
              <strong>Description:</strong> {{ .Annotations.description }}<br>
              <strong>Starts At:</strong> {{ .StartsAt }}<br>
            </div>
          {{ end }}
