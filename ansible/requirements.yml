---
# Ansible Galaxy collection dependencies for VM provisioning
# Versions pinned to match local dev environment (ansible-core 2.20.4)
# Install with: ansible-galaxy collection install -r ansible/requirements.yml
collections:
  # Windows VM management (win_uri, win_ping, win_user, win_shell, etc.)
  - name: ansible.windows
    version: "3.5.0"

  # POSIX modules (firewalld for Fedora/Rocky/Alma)
  - name: ansible.posix
    version: "2.1.0"

  # Community Windows modules (win_chocolatey, win_updates, win_environment, etc.)
  - name: community.windows
    version: "3.1.0"

  # Community general modules (seport, various utilities)
  - name: community.general
    version: "12.5.0"
