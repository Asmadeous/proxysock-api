---
- name: Configure Rocky Linux VPS UNMANAGED
  hosts: linux
  become: yes

  pre_tasks:
    - name: Ensure root_password is defined
      fail:
        msg: "root_password must be defined for security reasons."
      when: root_password is not defined

  vars:
    new_user_password: "{{ root_password }}"
  tasks:
    - block:
        - name: Wait for SSH
          wait_for_connection:
            timeout: 300
    
        - name: Update package cache
          dnf:
            update_cache: yes
    
        - name: Create hostname user
          user:
            name: "{{ hostname }}"
            password: "{{ new_user_password | password_hash('sha512') }}"
            groups: wheel
            shell: /bin/bash
            create_home: yes
            state: present
            no_log: true
          when: hostname is defined

        - name: Configure SSH to use custom port
          lineinfile:
            path: /etc/ssh/sshd_config
            regexp: '^#?Port '
            line: "Port {{ custom_port | default(22) }}"
          notify: restart_ssh
    
        - name: Set hostname
          hostname:
            name: "{{ hostname }}"
          when: hostname is defined
    
        - name: Update /etc/hosts with hostname
          lineinfile:
            path: /etc/hosts
            regexp: '^127\.0\.1\.1'
            line: "127.0.1.1 {{ hostname | default(ansible_hostname) }}"
          when: hostname is defined
    
        - name: Enable EPEL repository
          dnf:
            name: epel-release
            state: present

        - name: Install basic packages
          dnf:
            name:
              - curl
              - wget
              - vim
              - fail2ban
              - dnf-automatic
            state: present

        - name: Enable security services
          systemd:
            name: "{{ item }}"
            enabled: yes
            state: started
          loop:
            - fail2ban
            - dnf-automatic.timer

        - name: Final configuration step
          command: echo "Configuration complete"
          
        - name: Notify API - Success
          uri:
            url: "{{ api_url }}/vm/{{ vm_id }}/status"
            method: POST
            headers:
              Authorization: "Bearer {{ api_key }}"
              Content-Type: "application/json"
            body_format: json
            body:
              vm_id: "{{ vm_id }}"
              status: "configured"
              os_template: "{{ os_template }}"
              management_type: "{{ management_type }}"
            validate_certs: yes
            no_log: true
          delegate_to: localhost

      rescue:
        - name: Notify API - Failure
          uri:
            url: "{{ api_url }}/vm/{{ vm_id }}/status"
            method: POST
            headers:
              Authorization: "Bearer {{ api_key }}"
              Content-Type: "application/json"
            body_format: json
            body:
              vm_id: "{{ vm_id }}"
              status: "failed"
              os_template: "{{ os_template }}"
              management_type: "{{ management_type }}"
              error: "{{ ansible_failed_task.name | default('Unknown task') }} failed: {{ ansible_failed_result.msg | default('No error message') }}"
            validate_certs: yes
            no_log: true
          delegate_to: localhost
          ignore_errors: yes

  handlers:
    - name: restart_ssh
      systemd:
        name: sshd
        state: restarted