---
# RedHat/Fedora/Alma/Rocky specific Tailscale tasks

- name: Wait for DNF/RPM lock
  shell: |
    # Loop until the lock is released
    LOCK_FILES="/var/run/dnf.pid /var/lib/rpm/.rpm.lock"
    
    for lock in $LOCK_FILES; do
      if [ -f "$lock" ]; then
        count=0
        while (lsof "$lock" >/dev/null 2>&1 || fuser "$lock" >/dev/null 2>&1) && [ $count -lt 60 ]; do
          echo "Waiting for DNF/RPM lock on $lock... ($((count * 5))s)"
          sleep 5
          count=$((count + 1))
        done
      fi
    done
  changed_when: false
  ignore_errors: true

- name: "[Fedora 41+] Install python3-libdnf5"
  raw: |
    if command -v dnf5 >/dev/null 2>&1 || [ -f /usr/bin/dnf5 ]; then
      dnf install -y python3-libdnf5
    fi
  when:
    - ansible_facts['distribution'] == 'Fedora'
    - ansible_facts['distribution_major_version'] | int >= 41

- name: Install Tailscale (RedHat family)
  shell: |
    if ! command -v tailscale >/dev/null 2>&1; then
      curl -fsSL https://tailscale.com/install.sh | sh
    fi
  retries: 5
  delay: 10

- name: "[SELinux] Check tailscale_enabled boolean"
  command: getsebool tailscale_enabled
  register: tailscale_bool_check
  failed_when: false
  changed_when: false
  when:
    - ansible_facts['selinux'] is defined
    - ansible_facts['selinux'].status == "enabled"

- name: "[SELinux] Set tailscale_enabled boolean"
  seboolean:
    name: tailscale_enabled
    state: true
    persistent: true
  ignore_errors: true
  when:
    - ansible_facts['selinux'] is defined
    - ansible_facts['selinux'].status == "enabled"
    - tailscale_bool_check.rc is defined
    - tailscale_bool_check.rc == 0

- name: "[SELinux] Label Tailscale UDP port"
  command: semanage port -a -t tailscaled_port_t -p udp 41641
  ignore_errors: true
  when:
    - ansible_facts['selinux'] is defined
    - ansible_facts['selinux'].status == "enabled"
