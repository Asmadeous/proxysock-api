---
- name: Configure Ubuntu Desktop RDP MANAGED
  hosts: linux
  become: true
  gather_facts: false

  pre_tasks:
    - name: Ensure rdp_password is defined
      fail:
        msg: "rdp_password must be defined for security reasons."
      when: rdp_password is not defined

    - name: Wait for system to stabilize
      pause:
        seconds: 30
      run_once: true

  vars:
    admin_username: "{{ hostname | default('rdp-user') }}"
    admin_password: "{{ rdp_password }}"
    api_url: "{{ api_url | default('http://localhost:4000') }}"
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_timeout: 120
    ansible_command_timeout: 1200
    node_exporter_port: 59100

  tasks:
    - block:
        - name: Establish SSH connection with extended wait
          wait_for_connection:
            timeout: 900
            delay: 30
            connect_timeout: 30

        - name: Gather facts after connectivity verified
          setup:

        - name: Grow root disk to fill the provisioned storage
          include_tasks: tasks/grow_disk.yml

        - name: Update package cache
          apt:
            update_cache: true
          environment:
            DEBIAN_FRONTEND: noninteractive
          retries: 5
          delay: 10

        - name: Install RDP packages
          apt:
            name:
              - xrdp
              - curl
              - wget
              - vim
              - fail2ban
              - prometheus-node-exporter
              - ssl-cert
            state: present
          environment:
            DEBIAN_FRONTEND: noninteractive
          retries: 3
          delay: 10

        - name: Create Administrator user for RDP
          user:
            name: "{{ admin_username }}"
            groups: sudo
            shell: /bin/bash
            create_home: true
            state: present
          no_log: true

        - name: Set Administrator password via OS native chpasswd
          shell: "echo '{{ admin_username }}:{{ admin_password }}' | chpasswd"
          no_log: true

        - name: Add users to ssl-cert group
          user:
            name: "{{ item }}"
            groups: ssl-cert
            append: true
          loop:
            - "{{ admin_username }}"
            - xrdp
          ignore_errors: true

        - name: Enable passwordless sudo for Administrator user
          copy:
            content: "{{ admin_username }} ALL=(ALL) NOPASSWD:ALL\n"
            dest: "/etc/sudoers.d/{{ admin_username }}"
            mode: '0440'
            validate: 'visudo -cf %s'

        # Step 1 — release port 22 from systemd socket control
        - name: Disable ssh.socket (use ssh service directly)
          systemd:
            name: ssh.socket
            state: stopped
            enabled: false
          ignore_errors: true

        # Step 2 — ensure the service itself is active
        - name: Ensure ssh service is enabled
          systemd:
            name: ssh
            enabled: true



        - name: Configure xrdp service (ini settings)
          ini_file:
            path: /etc/xrdp/xrdp.ini
            section: Globals
            option: "{{ item.option }}"
            value: "{{ item.value }}"
            backup: true
          loop:
            - { option: 'port', value: "{{ custom_port | default(3389) }}" }
            - { option: 'max_bpp', value: '32' }
            - { option: 'use_vsock', value: 'false' }
            - { option: 'tcp_nodelay', value: 'true' }
            - { option: 'tcp_keepalive', value: 'true' }
          notify: restart xrdp

        - name: Enable and start xrdp services
          systemd:
            name: "{{ item }}"
            enabled: true
            state: started
          loop:
            - xrdp
            - xrdp-sesman

        - name: Create .xsession file for RDP user
          copy:
            content: |
              #!/bin/sh
              export GNOME_SHELL_SESSION_MODE=ubuntu
              export XDG_CURRENT_DESKTOP=ubuntu:GNOME
              export XDG_SESSION_TYPE=x11
              export XDG_SESSION_DESKTOP=ubuntu
              export XDG_CONFIG_DIRS=/etc/xdg/xdg-ubuntu:/etc/xdg
              exec env -u SESSION_MANAGER -u DBUS_SESSION_BUS_ADDRESS gnome-session --session=ubuntu
            dest: "/home/{{ admin_username }}/.xsession"
            owner: "{{ admin_username }}"
            group: "{{ admin_username }}"
            mode: '0755'

        - name: Configure Polkit to allow color management over RDP (modern rules)
          copy:
            dest: /etc/polkit-1/rules.d/45-allow-colord.rules
            content: |
              polkit.addRule(function(action, subject) {
                  if ((action.id == "org.freedesktop.color-manager.create-device" ||
                       action.id == "org.freedesktop.color-manager.create-profile" ||
                       action.id == "org.freedesktop.color-manager.delete-device" ||
                       action.id == "org.freedesktop.color-manager.delete-profile" ||
                       action.id == "org.freedesktop.color-manager.modify-device" ||
                       action.id == "org.freedesktop.color-manager.modify-profile") &&
                      subject.isInGroup("ssl-cert")) {
                      return polkit.Result.YES;
                  }
              });
            mode: '0644'
          ignore_errors: true

        - name: Allow RDP port in UFW
          ufw:
            rule: allow
            port: "{{ custom_port | default(3389) }}"
            proto: tcp
          ignore_errors: true

        - name: Enable security services
          systemd:
            name: "{{ item }}"
            enabled: true
            state: started
          loop:
            - fail2ban
          ignore_errors: true

        # Security hardening - Fail2ban synchronization
        - name: Configure fail2ban for SSH
          copy:
            content: |
              [sshd]
              enabled = true
              port = 22
              filter = sshd
              logpath = /var/log/auth.log
              maxretry = 3
              bantime = 3600
              findtime = 600
            dest: /etc/fail2ban/jail.d/sshd.conf
            mode: '0644'
          notify: restart_fail2ban

        - name: Set hostname
          hostname:
            name: "{{ hostname | default('ubuntu-rdp') }}"
          when: hostname is defined

        - name: Update /etc/hosts with hostname
          lineinfile:
            path: /etc/hosts
            regexp: '^127\.0\.1\.1'
            line: "127.0.1.1 {{ hostname | default(ansible_facts['hostname']) }}"
          when: hostname is defined

        - name: Configure proxy settings
          include_tasks: tasks/proxy_config.yml
          when: proxy_config is defined

        - name: Configure Tailscale VPN
          include_tasks: tasks/tailscale_linux.yml
          when: tailscale_config is defined

        - name: Notify API - Success
          uri:
            url: "{{ api_url }}/vm/{{ vm_id }}/status"
            method: POST
            headers:
              Authorization: "Bearer {{ api_key }}"
              Content-Type: "application/json"
            body_format: json
            body:
              vm_id: "{{ vm_id }}"
              status: "configured"
              os_template: "{{ os_template | default('ubuntu-rdp') }}"
              management_type: "managed"
              rdp_configured: true
            status_code: [200, 201]
            validate_certs: true
            timeout: 30
          no_log: true
          when:
            - api_url is defined
            - vm_id is defined
          delegate_to: localhost
          become: false

        - name: Permanently disable SSH after playbook completion
          shell: "nohup bash -c 'sleep 5 && systemctl stop ssh && systemctl disable ssh' > /dev/null 2>&1 &"
          ignore_errors: true

      rescue:
        - name: Notify API - Failure
          uri:
            url: "{{ api_url }}/vm/{{ vm_id }}/status"
            method: POST
            headers:
              Authorization: "Bearer {{ api_key }}"
              Content-Type: "application/json"
            body_format: json
            body:
              vm_id: "{{ vm_id }}"
              status: "failed"
              error: "{{ ansible_failed_task.name | default('Unknown task') }} failed"
            validate_certs: true
          no_log: true
          delegate_to: localhost
          become: false
          ignore_errors: true

        - name: Force failure after notification
          fail:
            msg: "Provisioning failed during task: {{ ansible_failed_task.name | default('Unknown') }}"

  handlers:
    - name: restart xrdp
      systemd:
        name: "{{ item }}"
        state: restarted
      loop:
        - xrdp
        - xrdp-sesman

    - name: restart_fail2ban
      systemd:
        name: fail2ban
        state: restarted


