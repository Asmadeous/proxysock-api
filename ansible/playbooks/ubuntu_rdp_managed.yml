---
- name: Configure Ubuntu Desktop RDP with Management
  hosts: linux
  become: yes
  gather_facts: no

  pre_tasks:
    - name: Set rdp_password default if undefined
      set_fact:
        rdp_password: "SecurePass123!"
      when: rdp_password is not defined

  vars:
    ciuser: "administrator"
    admin_password: "{{ rdp_password }}"

    # Kept only for API/status text; no firewall use
    whitelist_ip: "{{ whitelist_ip | default('0.0.0.0') }}"

    provisioning_api_url: "{{ api_url | default('http://localhost:5000') }}"
    provisioning_api_key: "{{ api_key | default('your_api_key') }}"
    ansible_become_password: "temporary"

    proxy_server: "{{ proxy_config.protocol }}://{{ proxy_config.proxy_username | default('') }}:{{ proxy_config.proxy_password | default('') }}@{{ proxy_config.proxy_ip }}:{{ proxy_config.proxy_port }}"
    no_proxy: "{{ proxy_config.no_proxy | default('localhost,127.0.0.1,127.0.0.0/8,10.0.0.0/8,192.168.0.0/16,172.16.0.0/12,::1,*.local') }}"
    proxy_username: "{{ proxy_config.proxy_username | default('') }}"
    proxy_password: "{{ proxy_config.proxy_password | default('') }}"

    ansible_python_interpreter: /usr/bin/python3
    vm_id: "{{ vm_id | default('vm123') }}"
    hostname: "{{ hostname | default('ubuntu-rdp') }}"
    management_type: "{{ management_type | default('ansible') }}"

  tasks:
    - block:
        - name: Wait for SSH
          wait_for_connection:
            timeout: 300
            delay: 10

        - name: Gather facts after connection is established
          setup:

        - name: Create Administrator user for RDP
          user:
            name: "{{ ciuser }}"
            password: "{{ admin_password | password_hash('sha512') }}"
            groups: sudo
            shell: /bin/bash
            create_home: yes
          tags: users

        - name: Enable passwordless sudo for Administrator user
          copy:
            content: "{{ ciuser }} ALL=(ALL) NOPASSWD:ALL"
            dest: "/etc/sudoers.d/{{ ciuser }}"
            mode: '0440'
            validate: 'visudo -cf %s'
          tags: users

        - name: Configure system proxy settings for user environment
          block:
            - name: Set system-wide proxy in /etc/environment
              blockinfile:
                path: /etc/environment
                block: |
                  HTTP_PROXY={{ proxy_server }}
                  HTTPS_PROXY={{ proxy_server }}
                  http_proxy={{ proxy_server }}
                  https_proxy={{ proxy_server }}
                  NO_PROXY={{ no_proxy }},{{ ansible_default_ipv4.address | default('') }}
                  no_proxy={{ no_proxy }},{{ ansible_default_ipv4.address | default('') }}
                marker: "# {mark} ANSIBLE MANAGED PROXY BLOCK"
                create: yes

            - name: Configure APT proxy settings
              blockinfile:
                path: /etc/apt/apt.conf.d/95proxies
                block: |
                  Acquire::http::Proxy "{{ proxy_server }}";
                  Acquire::https::Proxy "{{ proxy_server }}";
                  Acquire::http::Proxy::localhost "DIRECT";
                  Acquire::https::Proxy::localhost "DIRECT";
                  Acquire::http::Proxy::127.0.0.1 "DIRECT";
                  Acquire::https::Proxy::127.0.0.1 "DIRECT";
                marker: "# {mark} ANSIBLE MANAGED APT PROXY BLOCK"
                create: yes

            - name: Configure wget proxy settings
              blockinfile:
                path: /etc/wgetrc
                block: |
                  http_proxy = {{ proxy_server }}
                  https_proxy = {{ proxy_server }}
                  no_proxy = {{ no_proxy }},{{ ansible_default_ipv4.address | default('') }}
                  use_proxy = on
                  proxy_user = {{ proxy_username }}
                  proxy_password = {{ proxy_password }}
                marker: "# {mark} ANSIBLE MANAGED PROXY BLOCK"
                create: yes

            - name: Configure curl proxy settings
              blockinfile:
                path: /etc/curlrc
                block: |
                  proxy = {{ proxy_server }}
                  noproxy = {{ no_proxy }},{{ ansible_default_ipv4.address | default('') }}
                  proxy-user = {{ proxy_username }}:{{ proxy_password }}
                marker: "# {mark} ANSIBLE MANAGED PROXY BLOCK"
                create: yes

            - name: Configure Git proxy settings
              blockinfile:
                path: /etc/gitconfig
                block: |
                  [http]
                      proxy = {{ proxy_server }}
                  [https]
                      proxy = {{ proxy_server }}
                marker: "# {mark} ANSIBLE MANAGED GIT PROXY BLOCK"
                create: yes

            - name: Create systemd proxy configuration directory
              file:
                path: /etc/systemd/system.conf.d
                state: directory
                mode: '0755'

            - name: Configure systemd services proxy settings
              copy:
                content: |
                  [Manager]
                  DefaultEnvironment="HTTP_PROXY={{ proxy_server }}" "HTTPS_PROXY={{ proxy_server }}" "NO_PROXY={{ no_proxy }},{{ ansible_default_ipv4.address | default('') }}"
                dest: /etc/systemd/system.conf.d/proxy.conf
                mode: '0644'
              notify: reload systemd

            - name: Create systemd override directories for RDP services
              file:
                path: "/etc/systemd/system/{{ item }}.service.d"
                state: directory
                mode: '0755'
              loop:
                - xrdp
                - xrdp-sesman
              tags: proxy_fix

            - name: Configure RDP services to bypass proxy completely
              copy:
                content: |
                  [Service]
                  Environment="HTTP_PROXY="
                  Environment="HTTPS_PROXY="
                  Environment="http_proxy="
                  Environment="https_proxy="
                  Environment="NO_PROXY=*"
                  Environment="no_proxy=*"
                  Environment="XRDP_SOCKET_PATH=/var/run/xrdp"
                dest: "/etc/systemd/system/{{ item }}.service.d/no-proxy.conf"
                mode: '0644'
              loop:
                - xrdp
                - xrdp-sesman
              notify:
                - reload systemd
                - restart xrdp
              tags: proxy_fix

            - name: Configure GNOME proxy settings for desktop users
              blockinfile:
                path: /etc/profile.d/proxy.sh
                block: |
                  export HTTP_PROXY="{{ proxy_server }}"
                  export HTTPS_PROXY="{{ proxy_server }}"
                  export http_proxy="{{ proxy_server }}"
                  export https_proxy="{{ proxy_server }}"
                  export NO_PROXY="{{ no_proxy }},{{ ansible_default_ipv4.address | default('') }}"
                  export no_proxy="{{ no_proxy }},{{ ansible_default_ipv4.address | default('') }}"
                marker: "# {mark} ANSIBLE MANAGED PROXY BLOCK"
                create: yes
                mode: '0644'

          when: proxy_config is defined
          tags: proxy

        - name: Configure bash proxy environment for Administrator user
          blockinfile:
            path: "/home/{{ ciuser }}/.bashrc"
            block: |
              export HTTP_PROXY="{{ proxy_server }}"
              export HTTPS_PROXY="{{ proxy_server }}"
              export http_proxy="{{ proxy_server }}"
              export https_proxy="{{ proxy_server }}"
              export NO_PROXY="{{ no_proxy }},{{ ansible_default_ipv4.address | default('') }}"
              export no_proxy="{{ no_proxy }},{{ ansible_default_ipv4.address | default('') }}"
            marker: "# {mark} ANSIBLE MANAGED PROXY BLOCK"
            create: yes
            owner: "{{ ciuser }}"
            group: "{{ ciuser }}"
            mode: '0644'
          when: proxy_config is defined
          tags: proxy

        - name: Install desktop and RDP packages
          apt:
            name:
              - ubuntu-desktop-minimal
              - xrdp
              - xorgxrdp
              - curl
              - wget
              - firefox
              - libreoffice
              - thunderbird
              - gimp
              - vlc
            state: present
            update_cache: yes
          retries: 3
          delay: 30
          environment:
            HTTP_PROXY: "{{ proxy_server if proxy_config is defined else '' }}"
            HTTPS_PROXY: "{{ proxy_server if proxy_config is defined else '' }}"
            NO_PROXY: "{{ no_proxy + ',' + ansible_default_ipv4.address | default('') if proxy_config is defined else '' }}"
          tags: packages

        - name: Configure complete xrdp.ini
          copy:
            content: |
              [Globals]
              ini_version=1
              fork=true
              port=3389
              tcp_nodelay=true
              tcp_keepalive=true
              security_layer=rdp
              certificate=
              key_file=
              ssl_protocols=TLSv1.2, TLSv1.3
              autorun=
              allow_channels=true
              allow_multimon=true
              bitmap_cache=true
              bitmap_compression=true
              bulk_compression=true
              max_bpp=32
              new_cursors=true
              use_fastpath=both
              use_vsock=false
              rdp_compress_type=1
              implicit_user=true

              [Logging]
              LogFile=xrdp.log
              LogLevel=INFO
              EnableSyslog=true
              SyslogLevel=INFO

              [Channels]
              rdpdr=true
              rdpsnd=true
              drdynvc=true
              cliprdr=true
              rail=true
              xrdpvr=true
              tcutils=true

              [Xorg]
              name=Xorg
              lib=libxup.so
              username=ask
              password=ask
              ip=127.0.0.1
              port=-1
              code=20

              [Xvnc]
              name=Xvnc
              lib=libvnc.so
              username=ask
              password=ask
              ip=127.0.0.1
              port=-1
              xserverbpp=24
              code=10

              [vnc-any]
              name=vnc-any
              lib=libvnc.so
              ip=ask
              port=ask5900
              username=na
              password=ask
              code=10

              [sesman-any]
              name=sesman-any
              lib=libvnc.so
              ip=ask
              port=ask3350
              username=ask
              password=ask
              code=10

              [neutrinordp-any]
              name=neutrinordp-any
              lib=libneutrinordp.so
              ip=ask
              port=ask3389
              username=ask
              password=ask
              code=10
            dest: /etc/xrdp/xrdp.ini
            backup: yes
          notify: restart xrdp
          tags: xrdp_config

        - name: Reload systemd daemon after proxy configurations
          systemd:
            daemon_reload: yes
          when: proxy_config is defined
          tags: proxy_fix

        - name: Enable and start xrdp services
          systemd:
            name: "{{ item }}"
            enabled: yes
            state: restarted
          loop:
            - xrdp
            - xrdp-sesman
          tags: services

        - name: Install Prometheus Node Exporter
          block:
            - name: Install Prometheus Node Exporter from Ubuntu repos
              apt:
                name: prometheus-node-exporter
                state: present
                update_cache: yes
              register: node_exporter_install
              retries: 3
              delay: 5
              environment:
                HTTP_PROXY: "{{ proxy_server if proxy_config is defined else '' }}"
                HTTPS_PROXY: "{{ proxy_server if proxy_config is defined else '' }}"
                NO_PROXY: "{{ no_proxy + ',' + ansible_default_ipv4.address | default('') if proxy_config is defined else '' }}"

            - name: Enable and start node exporter
              systemd:
                name: prometheus-node-exporter
                enabled: yes
                state: started
          tags: monitoring

        - name: Create custom metrics script
          copy:
            content: |
              #!/bin/bash
              echo "# HELP vm_info VM information"
              echo "# TYPE vm_info gauge"
              echo "vm_info{vm_id=\"{{ vm_id }}\",hostname=\"{{ hostname }}\",os_template=\"{{ os_template | default('ubuntu') }}\"} 1"
              echo "# HELP vm_rdp_port RDP port number"
              echo "# TYPE vm_rdp_port gauge"
              echo "vm_rdp_port {{ rdp_port | default(3389) }}"
            dest: /usr/local/bin/vm_metrics.sh
            mode: '0755'
          tags: monitoring

        - name: Create systemd service for custom metrics
          copy:
            content: |
              [Unit]
              Description=Generate custom VM metrics
              [Service]
              Type=oneshot
              ExecStart=/usr/local/bin/vm_metrics.sh
              User=root
              Group=root
            dest: /etc/systemd/system/vm-metrics.service
          tags: monitoring

        - name: Create systemd timer for custom metrics
          copy:
            content: |
              [Unit]
              Description=Generate custom VM metrics every 5 minutes
              [Timer]
              OnBootSec=1min
              OnUnitActiveSec=5min
              [Install]
              WantedBy=timers.target
            dest: /etc/systemd/system/vm-metrics.timer
          tags: monitoring

        - name: Enable and start custom metrics timer
          systemd:
            name: vm-metrics.timer
            enabled: yes
            state: started
            daemon_reload: yes
          tags: monitoring

        - name: Generate initial custom metrics
          command: systemctl start vm-metrics.service
          tags: monitoring

        - name: Set hostname
          hostname:
            name: "{{ hostname }}"
          tags: system_config

        - name: Verify RDP configuration
          shell: |
            echo "=== Ubuntu RDP Configuration Verification ==="
            echo "Administrator user: {{ ciuser }}"
            echo "User exists: $(id {{ ciuser }} &>/dev/null && echo 'YES' || echo 'NO')"
            echo "XRDP service status: $(systemctl is-active xrdp)"
            echo "XRDP-sesman service status: $(systemctl is-active xrdp-sesman)"
            echo "RDP port listening: $(netstat -ln | grep ':3389' &>/dev/null && echo 'YES' || echo 'NO')"
            echo "Prometheus exporter: $(systemctl is-active prometheus-node-exporter)"
          register: verification_result

        - name: Display verification results
          debug:
            msg: "{{ verification_result.stdout_lines }}"

        - name: Final configuration step
          shell: |
            echo "=== Ubuntu RDP with Management Configuration Complete ==="
            echo "✅ Administrator user '{{ ciuser }}' created"
            echo "✅ Proxy configuration applied (if enabled)"
            echo "✅ RDP services EXCLUDED from proxy settings"
            echo "✅ Ubuntu desktop and RDP packages installed"
            echo "✅ XRDP configured"
            echo "✅ Firewall NOT managed by this playbook"
            echo "Configuration complete"

        - name: Send success status to API
          uri:
            url: "{{ provisioning_api_url }}/vm/{{ vm_id }}/status"
            method: POST
            headers:
              Authorization: "Bearer {{ provisioning_api_key }}"
              Content-Type: "application/json"
            body_format: json
            body:
              vm_id: "{{ vm_id }}"
              status: "configured"
              os_template: "{{ os_template | default('ubuntu') }}"
              management_type: "{{ management_type }}"
              whitelist_ip: "{{ whitelist_ip }}"
              admin_configured: true
              rdp_configured: true
              rdp_port: 3389
              monitoring_port: 9100
              proxy_configured: "{{ proxy_config is defined }}"
              rdp_proxy_excluded: true
              metrics_endpoint: "http://{{ inventory_hostname }}:9100/metrics"
              configuration_completed_at: "{{ ansible_date_time.iso8601 }}"
            status_code: [200, 201, 202]
            validate_certs: no
            timeout: 30
          when:
            - provisioning_api_url is defined
            - provisioning_api_key is defined
            - provisioning_api_url != 'http://localhost:5000'
            - provisioning_api_key != 'your_api_key'
          ignore_errors: yes
          tags: api_status

      rescue:
        - name: Send failure status to API
          uri:
            url: "{{ provisioning_api_url }}/vm/{{ vm_id }}/status"
            method: POST
            headers:
              Authorization: "Bearer {{ provisioning_api_key }}"
              Content-Type: "application/json"
            body_format: json
            body:
              vm_id: "{{ vm_id }}"
              status: "failed"
              os_template: "{{ os_template | default('ubuntu') }}"
              management_type: "{{ management_type | default('ansible') }}"
              whitelist_ip: "{{ whitelist_ip | default('') }}"
              error: "{{ ansible_failed_task.name | default('Unknown task') }} failed: {{ ansible_failed_result.msg | default('No error message') }}"
              failed_at: "{{ ansible_date_time.iso8601 }}"
            status_code: [200, 201, 202]
            validate_certs: no
            timeout: 30
          when:
            - provisioning_api_url is defined
            - provisioning_api_key is defined
            - provisioning_api_url != 'http://localhost:5000'
            - provisioning_api_key != 'your_api_key'
            - ansible_failed_result is defined
          ignore_errors: yes
          tags: always

  handlers:
    - name: restart xrdp
      systemd:
        name: "{{ item }}"
        state: restarted
      loop:
        - xrdp
        - xrdp-sesman

    - name: restart node-exporter
      systemd:
        name: prometheus-node-exporter
        state: restarted

    - name: reload systemd
      systemd:
        daemon_reload: yes