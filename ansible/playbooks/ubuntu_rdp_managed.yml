---
- name: Configure Ubuntu Desktop RDP MANAGED
  hosts: linux
  become: yes
  gather_facts: no

  pre_tasks:
    - name: Ensure rdp_password is defined
      fail:
        msg: "rdp_password must be defined for security reasons."
      when: rdp_password is not defined

    - name: Wait for system to stabilize
      pause:
        seconds: 30
      run_once: true

  vars:
    admin_username: "{{ hostname | default('rdp-user') }}"
    admin_password: "{{ rdp_password }}"
    api_url: "{{ api_url | default('http://localhost:4000') }}"
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_timeout: 120
    ansible_command_timeout: 1200
    node_exporter_port: 59100

  tasks:
    - block:
        - name: Establish SSH connection with extended wait
          wait_for_connection:
            timeout: 900
            delay: 30
            connect_timeout: 30

        - name: Gather facts after connectivity verified
          setup:

        - name: Update package cache
          apt:
            update_cache: yes
          retries: 5
          delay: 10

        - name: Install RDP packages, desktop environment and monitoring tools
          apt:
            name:
              - xrdp
              - xfce4
              - xfce4-goodies
              - curl
              - wget
              - vim
              - fail2ban
              - prometheus-node-exporter
            state: present
          retries: 3
          delay: 10

        - name: Create Administrator user for RDP
          user:
            name: "{{ admin_username }}"
            password: "{{ admin_password | password_hash('sha512') }}"
            groups: sudo
            shell: /bin/bash
            create_home: yes
            state: present
          no_log: true

        - name: Enable passwordless sudo for Administrator user
          copy:
            content: "{{ admin_username }} ALL=(ALL) NOPASSWD:ALL\n"
            dest: "/etc/sudoers.d/{{ admin_username }}"
            mode: '0440'
            validate: 'visudo -cf %s'

        - name: Configure SSH to use custom port
          lineinfile:
            path: /etc/ssh/sshd_config
            regexp: '^#?Port '
            line: "Port {{ custom_port | default(22) }}"
          notify: restart_ssh

        - name: Configure xrdp service
          lineinfile:
            path: /etc/xrdp/xrdp.ini
            regexp: "{{ item.regexp }}"
            line: "{{ item.line }}"
            backup: yes
          loop:
            - { regexp: '^max_bpp=', line: 'max_bpp=32' }
            - { regexp: '^use_vsock=', line: 'use_vsock=false' }
            - { regexp: '^tcp_nodelay=', line: 'tcp_nodelay=true' }
            - { regexp: '^tcp_keepalive=', line: 'tcp_keepalive=true' }
          notify: restart xrdp

        - name: Enable and start xrdp services
          systemd:
            name: "{{ item }}"
            enabled: yes
            state: started
          loop:
            - xrdp
            - xrdp-sesman

        - name: Set hostname
          hostname:
            name: "{{ hostname | default('ubuntu-rdp') }}"
          when: hostname is defined

        - name: Update /etc/hosts with hostname
          lineinfile:
            path: /etc/hosts
            regexp: '^127\.0\.1\.1'
            line: "127.0.1.1 {{ hostname | default(ansible_facts['hostname']) }}"
          when: hostname is defined

        - name: Configure proxy settings
          include_tasks: tasks/proxy_config.yml
          when: proxy_config is defined

        - name: Configure Tailscale VPN
          include_tasks: tasks/tailscale_linux.yml
          when: tailscale_config is defined

        # ── Monitoring ────────────────────────────────────────────────────────

        - name: Configure Prometheus Node Exporter to listen on custom port
          copy:
            content: |
              ARGS="--web.listen-address=:{{ node_exporter_port }}"
            dest: /etc/default/prometheus-node-exporter
            mode: '0644'
          notify: restart node-exporter

        - name: Create textfile collector directory
          file:
            path: /var/lib/prometheus/node-exporter
            state: directory
            owner: prometheus
            group: prometheus
            mode: '0755'
          ignore_errors: true

        - name: Create custom VM metrics script
          copy:
            content: |
              #!/bin/bash
              METRICS_FILE="/var/lib/prometheus/node-exporter/vm_info.prom"
              cat > "${METRICS_FILE}.tmp" <<EOF
              # HELP vm_info VM metadata information
              # TYPE vm_info gauge
              vm_info{vm_id="{{ vm_id | default('unknown') }}",hostname="{{ hostname | default('unknown') }}",os="ubuntu",management_type="{{ management_type | default('managed') }}"} 1
              EOF
              mv "${METRICS_FILE}.tmp" "${METRICS_FILE}"
            dest: /usr/local/bin/vm_metrics.sh
            mode: '0755'

        - name: Set up cron job for VM metrics
          cron:
            name: "VM metrics collection"
            minute: "*/5"
            job: "/usr/local/bin/vm_metrics.sh"
            user: root

        - name: Configure fail2ban
          copy:
            content: |
              [sshd]
              enabled = true
              port = {{ custom_port | default(22) }}
              filter = sshd
              logpath = /var/log/auth.log
              maxretry = 3
              bantime = 3600
              findtime = 600
            dest: /etc/fail2ban/jail.d/sshd.conf
            mode: '0644'
          notify: restart_fail2ban

        - name: Enable monitoring and security services
          systemd:
            name: "{{ item }}"
            enabled: yes
            state: started
          loop:
            - prometheus-node-exporter
            - fail2ban
          ignore_errors: yes

        - name: Send status to management API
          uri:
            url: "{{ api_url }}/vm/{{ vm_id }}/status"
            method: POST
            headers:
              Authorization: "Bearer {{ api_key }}"
              Content-Type: "application/json"
            body_format: json
            body:
              status: "configured"
              vm_id: "{{ vm_id }}"
              hostname: "{{ hostname | default(ansible_facts['hostname']) }}"
              os_template: "{{ os_template | default('ubuntu') }}"
              management_type: "{{ management_type | default('managed') }}"
              rdp_configured: true
              connectivity_status: "working"
              configuration_timestamp: "{{ ansible_facts['date_time']['iso8601'] | default('unknown') }}"
              proxy_configured: "{{ proxy_config is defined }}"
              monitoring_enabled: true
            status_code: [200, 201]
            validate_certs: yes
            timeout: 30
          no_log: true
          when:
            - api_url is defined
            - vm_id is defined
          delegate_to: localhost
          become: no
          register: api_response
          failed_when: false
          ignore_errors: yes

        - name: Final configuration step
          shell: |
            echo "=== Ubuntu RDP MANAGED Configuration Complete ==="
            echo "✅ Administrator user '{{ admin_username }}' created"
            echo "✅ SSH port set to {{ custom_port | default(22) }}"
            echo "✅ RDP (xrdp/xfce4) configured"
            echo "✅ Monitoring enabled (Prometheus Node Exporter :{{ node_exporter_port }})"
            echo "✅ Security hardening (fail2ban)"
            echo "✅ Proxy configured: {{ 'Yes' if proxy_config is defined else 'No' }}"
            echo ""
            echo "Configuration complete"

      rescue:
        - name: Notify API - Failure
          uri:
            url: "{{ api_url }}/vm/{{ vm_id }}/status"
            method: POST
            headers:
              Authorization: "Bearer {{ api_key }}"
              Content-Type: "application/json"
            body_format: json
            body:
              vm_id: "{{ vm_id }}"
              status: "failed"
              os_template: "{{ os_template | default('ubuntu') }}"
              management_type: "{{ management_type | default('managed') }}"
              error: "{{ ansible_failed_task.name | default('Unknown task') }} failed: {{ ansible_failed_result.msg | default('No error message') }}"
              failed_at: "{{ ansible_facts['date_time']['iso8601'] | default('unknown') }}"
            status_code: [200, 201]
            validate_certs: yes
            timeout: 30
          no_log: true
          when:
            - api_url is defined
            - vm_id is defined
          delegate_to: localhost
          become: no
          ignore_errors: yes

        - name: Final failure notification
          debug:
            msg:
              - "❌ Ubuntu RDP MANAGED Configuration FAILED!"
              - "❌ VM ID: {{ vm_id | default('unknown') }}"
              - "❌ Task: {{ ansible_failed_task.name | default('Unknown') }}"
              - "❌ Error: {{ ansible_failed_result.msg | default('Unknown error') }}"

  handlers:
    - name: restart xrdp
      systemd:
        name: "{{ item }}"
        state: restarted
      loop:
        - xrdp
        - xrdp-sesman

    - name: restart_fail2ban
      systemd:
        name: fail2ban
        state: restarted
      ignore_errors: true

    - name: restart_ssh
      systemd:
        name: ssh
        state: restarted
      ignore_errors: true

    - name: restart node-exporter
      systemd:
        name: prometheus-node-exporter
        state: restarted
      ignore_errors: true

    - name: reload systemd
      systemd:
        daemon_reload: yes