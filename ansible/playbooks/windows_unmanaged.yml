---
- name: Configure Windows RDP UNMANAGED
  hosts: windows
  gather_facts: no

  pre_tasks:
    - name: Ensure rdp_password is defined
      fail:
        msg: "rdp_password must be defined for security reasons."
      when: rdp_password is not defined

  vars:
    admin_password: "{{ rdp_password }}"
    api_url: "{{ api_url | default('') }}"
    
  tasks:
    - block:
        - name: Wait for WinRM
          win_ping:
          retries: 30
          delay: 10

        - name: Gather facts
          setup:

        - name: Configure Background Security Updates
          include_tasks: tasks/windows_background_updates.yml
          tags: security


        - name: Configure Administrator account
          block:
            - name: Ensure critical services are running
              win_service:
                name: "{{ item }}"
                state: started
                start_mode: auto
              loop:
                - wuauserv
              ignore_errors: yes

            - name: Enable Administrator account
              win_user:
                name: Administrator
                account_disabled: false
                state: present

            - name: Set Administrator password
              win_user:
                name: Administrator
                password: "{{ admin_password }}"
                password_never_expires: yes
                state: present
              no_log: true

            - name: Ensure Administrator is in Administrators group
              win_group_membership:
                name: Administrators
                members:
                  - Administrator
                state: present

        - name: Enable RDP for remote management
          win_regedit:
            path: "{{ item.path }}"
            name: "{{ item.name }}"
            data: "{{ item.data }}"
            type: dword
          loop:
            - path: "HKLM:\\System\\CurrentControlSet\\Control\\Terminal Server"
              name: "fDenyTSConnections"
              data: 0
            - path: "HKLM:\\System\\CurrentControlSet\\Control\\Terminal Server\\WinStations\\RDP-Tcp"
              name: "UserAuthentication"
              data: 0
            - path: "HKLM:\\System\\CurrentControlSet\\Control\\Terminal Server\\WinStations\\RDP-Tcp"
              name: "SecurityLayer"
              data: 0

        - name: Configure RDP Port in Registry
          win_regedit:
            path: "{{ item }}"
            name: PortNumber
            data: "{{ custom_port | default(3389) }}"
            type: dword
          loop:
            - "HKLM:\\System\\CurrentControlSet\\Control\\Terminal Server\\WinStations\\RDP-Tcp"
            - "HKLM:\\System\\CurrentControlSet\\Control\\Terminal Server"

        - name: Allow RDP through Windows Firewall
          win_firewall_rule:
            name: "Remote Desktop - Custom ({{ custom_port | default(3389) }})"
            localport: "{{ custom_port | default(3389) }}"
            action: allow
            direction: in
            protocol: tcp
            state: present
            enabled: yes

        - name: Set hostname
          win_hostname:
            name: "{{ hostname }}"
          register: hostname_result
          when: hostname is defined

        - name: Enforce Command-Line Interface for VPS (Disable GUI)
          win_regedit:
            path: 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
            name: Shell
            data: 'cmd.exe'
            type: string
          when: vm_type is defined and vm_type == 'vps'

        - name: Reboot to apply all changes
          win_reboot:
            reboot_timeout: 600
            post_reboot_delay: 30
          when: >
            (hostname_result is defined and hostname_result.reboot_required) or
            (update_result is defined and update_result.reboot_required) or
            true

        - name: Notify API - Success
          uri:
            url: "{{ api_url }}/vm/{{ vm_id }}/status"
            method: POST
            headers:
              Authorization: "Bearer {{ api_key }}"
              Content-Type: "application/json"
            body_format: json
            body:
              vm_id: "{{ vm_id }}"
              status: "configured"
              os_template: "{{ os_template | default('windows-server') }}"
              management_type: "unmanaged"
            validate_certs: yes
          no_log: true
          delegate_to: localhost
          when: api_url != "" and api_key != "" and vm_id is defined

      rescue:
        - name: Notify API - Failure
          uri:
            url: "{{ api_url }}/vm/{{ vm_id }}/status"
            method: POST
            headers:
              Authorization: "Bearer {{ api_key }}"
              Content-Type: "application/json"
            body_format: json
            body:
              vm_id: "{{ vm_id }}"
              status: "failed"
              os_template: "{{ os_template | default('windows-server') }}"
              error: "{{ ansible_failed_task.name | default('Unknown task') }}: {{ ansible_failed_result.msg | default('No error') }}"
            validate_certs: yes
          no_log: true
          delegate_to: localhost
          ignore_errors: yes
          when: vm_id is defined