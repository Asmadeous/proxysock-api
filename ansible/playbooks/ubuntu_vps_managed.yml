---
- name: Configure Ubuntu VPS MANAGED
  hosts: linux
  become: yes
  gather_facts: no

  pre_tasks:
    - name: Ensure root_password is defined
      fail:
        msg: "root_password must be defined for security reasons."
      when: root_password is not defined

    - name: Wait for system to stabilize
      pause:
        seconds: 30
      run_once: true

  vars:
    new_user: "{{ hostname | default('vps-user') }}"
    new_root_password: "{{ root_password }}"
    api_url: "{{ api_url | default('http://localhost:4000') }}"
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_timeout: 120
    ansible_command_timeout: 1200
    node_exporter_port: 59100

  tasks:
    - block:
        - name: Establish SSH connection with extended wait
          wait_for_connection:
            timeout: 900
            delay: 30
            connect_timeout: 30

        - name: Gather facts after connectivity verified
          setup:

        - name: Update package cache
          apt:
            update_cache: yes
            cache_valid_time: 3600
          environment:
            DEBIAN_FRONTEND: noninteractive
          retries: 5
          delay: 10

        - name: Install essential packages and monitoring tools
          apt:
            name:
              - curl
              - wget
              - vim
              - git
              - net-tools
              - openssh-client
              - openssh-server
              - fail2ban
              - unattended-upgrades
              - apt-listchanges
              - prometheus-node-exporter
            state: present
          environment:
            DEBIAN_FRONTEND: noninteractive
          retries: 3
          delay: 10

        - name: Create user account
          user:
            name: "{{ new_user }}"
            password: "{{ new_root_password | password_hash('sha512') }}"
            shell: /bin/bash
            state: present
            groups: sudo
            append: yes
          no_log: true

        - name: Enable passwordless sudo for user
          copy:
            content: "{{ new_user }} ALL=(ALL) NOPASSWD:ALL\n"
            dest: "/etc/sudoers.d/{{ new_user }}"
            mode: '0440'
            validate: 'visudo -cf %s'

        - name: Set root password
          user:
            name: root
            password: "{{ new_root_password | password_hash('sha512') }}"
            update_password: always
          no_log: true

        - name: Configure SSH to use custom port
          lineinfile:
            path: /etc/ssh/sshd_config
            regexp: '^#?Port '
            line: "Port {{ custom_port | default(22) }}"
          notify: restart_ssh

        - name: Set hostname
          hostname:
            name: "{{ hostname | default('ubuntu-vps') }}"
          when: hostname is defined

        - name: Update /etc/hosts with hostname
          lineinfile:
            path: /etc/hosts
            regexp: '^127\.0\.1\.1'
            line: "127.0.1.1 {{ hostname | default(ansible_facts['hostname']) }}"
          when: hostname is defined

        - name: Configure proxy settings
          include_tasks: tasks/proxy_config.yml
          when: proxy_config is defined

        # ── Monitoring ────────────────────────────────────────────────────────

        - name: Configure Prometheus Node Exporter to listen on custom port
          copy:
            content: |
              ARGS="--web.listen-address=:{{ node_exporter_port }}"
            dest: /etc/default/prometheus-node-exporter
            mode: '0644'
          notify: restart_node_exporter

        - name: Create textfile collector directory
          file:
            path: /var/lib/prometheus/node-exporter
            state: directory
            owner: prometheus
            group: prometheus
            mode: '0755'
          ignore_errors: true

        - name: Create custom VM metrics script
          copy:
            content: |
              #!/bin/bash
              METRICS_FILE="/var/lib/prometheus/node-exporter/vm_info.prom"
              cat > "${METRICS_FILE}.tmp" <<EOF
              # HELP vm_info VM identity information
              # TYPE vm_info gauge
              vm_info{vm_id="{{ vm_id }}",hostname="{{ hostname }}",os_template="{{ os_template | default('ubuntu') }}",management_type="managed"} 1
              # HELP vm_ssh_port SSH port configured on this VM
              # TYPE vm_ssh_port gauge
              vm_ssh_port{vm_id="{{ vm_id }}"} {{ custom_port | default(22) }}
              EOF
              mv "${METRICS_FILE}.tmp" "${METRICS_FILE}"
            dest: /usr/local/bin/vm_metrics.sh
            mode: '0755'

        - name: Create systemd service for custom metrics
          copy:
            content: |
              [Unit]
              Description=Generate custom VM metrics for Prometheus
              After=network.target

              [Service]
              Type=oneshot
              ExecStart=/usr/local/bin/vm_metrics.sh
            dest: /etc/systemd/system/vm-metrics.service
            mode: '0644'

        - name: Create systemd timer for custom metrics
          copy:
            content: |
              [Unit]
              Description=Refresh custom VM metrics every 5 minutes

              [Timer]
              OnBootSec=1min
              OnUnitActiveSec=5min

              [Install]
              WantedBy=timers.target
            dest: /etc/systemd/system/vm-metrics.timer
            mode: '0644'

        - name: Enable and start monitoring services
          systemd:
            name: "{{ item }}"
            enabled: yes
            state: started
            daemon_reload: yes
          loop:
            - prometheus-node-exporter
            - vm-metrics.timer
            - fail2ban
            - unattended-upgrades

        - name: Run initial custom metrics generation
          systemd:
            name: vm-metrics.service
            state: started

        # ── Security ─────────────────────────────────────────────────────────

        - name: Configure fail2ban for SSH
          copy:
            content: |
              [sshd]
              enabled = true
              port = ssh
              filter = sshd
              logpath = /var/log/auth.log
              maxretry = 3
              bantime = 3600
              findtime = 600
            dest: /etc/fail2ban/jail.d/sshd.conf
            mode: '0644'
          notify: restart_fail2ban

        - name: Configure unattended upgrades
          lineinfile:
            path: /etc/apt/apt.conf.d/20auto-upgrades
            regexp: "{{ item.regexp }}"
            line: "{{ item.line }}"
            create: yes
          loop:
            - { regexp: '^APT::Periodic::Update-Package-Lists', line: 'APT::Periodic::Update-Package-Lists "1";' }
            - { regexp: '^APT::Periodic::Unattended-Upgrade',   line: 'APT::Periodic::Unattended-Upgrade "1";' }
            - { regexp: '^APT::Periodic::AutocleanInterval',    line: 'APT::Periodic::AutocleanInterval "7";' }

        # ── Tailscale / VPN ──────────────────────────────────────────────────

        - name: Configure Tailscale VPN
          include_tasks: tasks/tailscale_linux.yml
          when: tailscale_config is defined

        # ── API Callback ─────────────────────────────────────────────────────

        - name: Notify API - Success
          uri:
            url: "{{ api_url }}/vm/{{ vm_id }}/status"
            method: POST
            headers:
              Authorization: "Bearer {{ api_key }}"
              Content-Type: "application/json"
            body_format: json
            body:
              vm_id: "{{ vm_id }}"
              status: "configured"
              os_template: "{{ os_template | default('ubuntu') }}"
              management_type: "{{ management_type | default('managed') }}"
              admin_configured: true
              monitoring_port: "{{ node_exporter_port }}"
              proxy_configured: "{{ proxy_config is defined }}"
              configuration_completed_at: "{{ ansible_facts['date_time']['iso8601'] | default('unknown') }}"
            status_code: [200, 201]
            validate_certs: yes
            timeout: 30
          no_log: true
          when:
            - api_url is defined
            - vm_id is defined
          delegate_to: localhost
          become: no

      rescue:
        - name: Notify API - Failure
          uri:
            url: "{{ api_url }}/vm/{{ vm_id }}/status"
            method: POST
            headers:
              Authorization: "Bearer {{ api_key }}"
              Content-Type: "application/json"
            body_format: json
            body:
              vm_id: "{{ vm_id }}"
              status: "failed"
              os_template: "{{ os_template | default('ubuntu') }}"
              management_type: "{{ management_type | default('managed') }}"
              error: "{{ ansible_failed_task.name | default('Unknown task') }} failed: {{ ansible_failed_result.msg | default('No error message') }}"
              failed_at: "{{ ansible_facts['date_time']['iso8601'] | default('unknown') }}"
            validate_certs: yes
          no_log: true
          delegate_to: localhost
          become: no
          ignore_errors: yes

        - name: Final failure notification
          debug:
            msg:
              - "❌ Ubuntu VPS Managed Configuration FAILED!"
              - "❌ VM ID: {{ vm_id | default('unknown') }}"
              - "❌ Task: {{ ansible_failed_task.name | default('Unknown') }}"
              - "❌ Error: {{ ansible_failed_result.msg | default('Unknown error') }}"

  handlers:
    - name: restart_ssh
      systemd:
        name: ssh
        state: restarted

    - name: restart_fail2ban
      systemd:
        name: fail2ban
        state: restarted
      ignore_errors: true

    - name: restart_node_exporter
      systemd:
        name: prometheus-node-exporter
        state: restarted

    - name: reload systemd
      systemd:
        daemon_reload: yes