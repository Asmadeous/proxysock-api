---
- name: Configure Ubuntu Desktop RDP UNMANAGED
  hosts: linux
  become: yes
  gather_facts: no

  pre_tasks:
    - name: Ensure rdp_password is defined
      fail:
        msg: "rdp_password must be defined for security reasons."
      when: rdp_password is not defined

  vars:
    # User credentials
    admin_username: "{{ hostname | default('rdp-user') }}"
    admin_password: "{{ rdp_password }}"
    
    # API configuration
    api_url: "{{ api_url | default('http://localhost:4000') }}"
    ansible_become_password: "{{ rdp_password }}"
    ansible_python_interpreter: /usr/bin/python3
    
  tasks:
    - block:
        - name: Wait for SSH
          wait_for_connection:
            timeout: 300

        - name: Gather facts after connectivity verified
          setup:

        - name: Update package cache
          apt:
            update_cache: yes
          retries: 5
          delay: 10

        - name: Install RDP packages and desktop environment
          apt:
            name:
              - xrdp
              - xfce4
              - xfce4-goodies
            state: present
          retries: 3
          delay: 10

        - name: Create Administrator user for RDP
          user:
            name: "{{ admin_username }}"
            password: "{{ admin_password | password_hash('sha512') }}"
            groups: sudo
            shell: /bin/bash
            create_home: yes
            state: present
            no_log: true

        - name: Configure xrdp service
          lineinfile:
            path: /etc/xrdp/xrdp.ini
            regexp: "{{ item.regexp }}"
            line: "{{ item.line }}"
            backup: yes
          loop:
            - { regexp: '^max_bpp=', line: 'max_bpp=32' }
            - { regexp: '^use_vsock=', line: 'use_vsock=false' }
            - { regexp: '^tcp_nodelay=', line: 'tcp_nodelay=true' }
            - { regexp: '^tcp_keepalive=', line: 'tcp_keepalive=true' }
          notify: restart xrdp

        - name: Enable and start xrdp services
          systemd:
            name: "{{ item }}"
            enabled: yes
            state: started
          loop:
            - xrdp
            - xrdp-sesman

        - name: Set hostname
          hostname:
            name: "{{ hostname | default('ubuntu-rdp') }}"
          when: hostname is defined

        - name: Update /etc/hosts with hostname
          lineinfile:
            path: /etc/hosts
            regexp: '^127\.0\.1\.1'
            line: "127.0.1.1 {{ hostname | default(ansible_hostname) }}"
          when: hostname is defined

        - name: Install basic packages
          apt:
            name:
              - curl
              - wget
              - vim
            state: present

        - name: Verify RDP configuration
          shell: |
            echo "=== Ubuntu RDP Configuration Verification ==="
            echo "Administrator user: {{ admin_username }}"
            echo "User exists: $(id {{ admin_username }} &>/dev/null && echo 'YES' || echo 'NO')"
            echo "XRDP service status: $(systemctl is-active xrdp)"
            echo "XRDP-sesman service status: $(systemctl is-active xrdp-sesman)"
            echo "RDP port listening: $(netstat -ln | grep ':3389' &>/dev/null && echo 'YES' || echo 'NO')"
            echo ""
            echo "🐧 UBUNTU RDP READY FOR CONNECTION!"
            echo "Username: {{ admin_username }}"
            echo "Connect to: <external_ip>:<external_port>"
          register: verification_result

        - name: Display verification results
          debug:
            msg: "{{ verification_result.stdout_lines }}"

        - name: Final configuration step
          shell: |
            echo "=== Ubuntu RDP Configuration Complete ==="
            echo "✅ Administrator user '{{ admin_username }}' created"
            echo "✅ XRDP and XFCE4 desktop installed"
            echo "✅ RDP enabled and listening on port 3389"
            echo ""
            echo "CONNECTION DETAILS:"
            echo "- Username: {{ admin_username }}"
            echo "- Password: [Set via rdp_password variable]"
            echo "- RDP Port: 3389"
            echo "- Connect to: <external_ip>:<external_port>"
            echo ""
            echo "Configuration complete"

        - name: Notify API - Success
          uri:
            url: "{{ api_url }}/vm/{{ vm_id }}/status"
            method: POST
            headers:
              Authorization: "Bearer {{ api_key }}"
              Content-Type: "application/json"
            body_format: json
            body:
              vm_id: "{{ vm_id }}"
              status: "configured"
              os_template: "{{ os_template | default('ubuntu') }}"
              management_type: "{{ management_type | default('unmanaged') }}"
              admin_configured: true
              rdp_configured: true
              configuration_completed_at: "{{ ansible_date_time.iso8601 }}"
            status_code: [200, 201]
            validate_certs: yes
            timeout: 30
            no_log: true
          when:
            - api_url is defined
            - vm_id is defined
          delegate_to: localhost

      rescue:
        - name: Notify API - Failure
          uri:
            url: "{{ api_url }}/vm/{{ vm_id }}/status"
            method: POST
            headers:
              Authorization: "Bearer {{ api_key }}"
              Content-Type: "application/json"
            body_format: json
            body:
              vm_id: "{{ vm_id }}"
              status: "failed"
              os_template: "{{ os_template | default('ubuntu') }}"
              management_type: "{{ management_type | default('unmanaged') }}"
              error: "{{ ansible_failed_task.name | default('Unknown task') }} failed: {{ ansible_failed_result.msg | default('No error message') }}"
              failed_at: "{{ ansible_date_time.iso8601 }}"
            validate_certs: yes
            no_log: true
          delegate_to: localhost
          ignore_errors: yes

        - name: Final failure notification
          debug:
            msg: 
              - "❌ Ubuntu RDP Configuration FAILED!"
              - "❌ VM ID: {{ vm_id | default('unknown') }}"
              - "❌ Task: {{ ansible_failed_task.name | default('Unknown') }}"
              - "❌ Error: {{ ansible_failed_result.msg | default('Unknown error') }}"

  handlers:
    - name: restart xrdp
      systemd:
        name: "{{ item }}"
        state: restarted
      loop:
        - xrdp
        - xrdp-sesman