- name: Change User Password
  hosts: all
  become: yes
  pre_tasks:
    - name: Ensure password is defined
      fail:
        msg: "password must be defined for security reasons."
      when: password is not defined
  vars:
    new_password: "{{ password }}"
    target_user: "{{ user | default('root') }}"

  tasks:
    - name: Generate password hash
      set_fact:
        password_hash: "{{ new_password | password_hash('sha512') }}"

    - name: Update user password
      user:
        name: "{{ target_user }}"
        password: "{{ password_hash }}"
        update_password: always
        no_log: true
      register: password_result

    - name: Verify password change
      debug:
        msg: "Password change for {{ target_user }} successful: {{ password_result.changed }}"
