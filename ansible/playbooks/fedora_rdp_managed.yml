---
- name: Configure Fedora Desktop RDP MANAGED
  hosts: linux
  become: true
  gather_facts: false

  pre_tasks:
    - name: Ensure rdp_password is defined
      fail:
        msg: "rdp_password must be defined for security reasons."
      when: rdp_password is not defined

    - name: Wait for system to stabilize
      pause:
        seconds: 30
      run_once: true

  vars:
    admin_username: "{{ hostname | default('rdp-user') }}"
    admin_password: "{{ rdp_password }}"
    api_url: "{{ api_url | default('http://localhost:4000') }}"
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_timeout: 120
    ansible_command_timeout: 1200
    node_exporter_port: 59100

  tasks:
    - block:
        - name: Establish SSH connection with extended wait
          wait_for_connection:
            timeout: 900
            delay: 30
            connect_timeout: 30

        - name: Install python3-libdnf5 for Fedora 41+ compatibility
          raw: |
            if command -v dnf5 >/dev/null 2>&1 || [ -f /usr/bin/dnf5 ]; then
              dnf install -y python3-libdnf5
            fi
          register: libdnf5_install
          changed_when: "'Nothing to do' not in libdnf5_install.stdout"

        - name: Gather facts after connectivity verified
          setup:

        - name: Grow root disk to fill the provisioned storage
          include_tasks: tasks/grow_disk.yml


        - name: Install RDP packages and tools
          dnf:
            name:
              - xrdp
              - xrdp-selinux
              - xorgxrdp
              - fail2ban
              - dnf-automatic
              - policycoreutils-python-utils
              - curl
              - wget
              - vim
              - tar
            state: present
          retries: 3
          delay: 10

        - name: Create Administrator user for RDP
          user:
            name: "{{ admin_username }}"
            password: "{{ admin_password | password_hash('sha512') }}"
            groups: wheel
            shell: /bin/bash
            create_home: true
            state: present
          no_log: true

        - name: Enable passwordless sudo for Administrator user
          copy:
            content: "{{ admin_username }} ALL=(ALL) NOPASSWD:ALL\n"
            dest: "/etc/sudoers.d/{{ admin_username }}"
            mode: '0440'
            validate: 'visudo -cf %s'

        # Step 1 — release port 22 from systemd socket control
        - name: Disable sshd.socket (use sshd service directly)
          systemd:
            name: sshd.socket
            state: stopped
            enabled: false
          ignore_errors: true

        # Step 2 — ensure the service itself is active
        - name: Ensure sshd service is enabled
          systemd:
            name: sshd
            enabled: true



        # Step 4 — now this actually takes effect
        - name: Check if firewalld is running
          command: systemctl is-active firewalld
          register: firewalld_status
          failed_when: false
          changed_when: false



        - name: Allow RDP port in firewalld
          ansible.posix.firewalld:
            port: "{{ custom_port | default(3389) }}/tcp"
            permanent: true
            state: enabled
            immediate: true
          when: firewalld_status.stdout == 'active'

        - name: Add SELinux RDP port labeling
          seport:
            ports: "{{ custom_port | default(3389) }}"
            proto: tcp
            setype: rdp_port_t
            state: present
          when: custom_port is defined
          ignore_errors: true



        - name: Configure xrdp service
          lineinfile:
            path: /etc/xrdp/xrdp.ini
            regexp: "{{ item.regexp }}"
            line: "{{ item.line }}"
            backup: true
          loop:
            - { regexp: '^max_bpp=', line: 'max_bpp=32' }
            - { regexp: '^use_vsock=', line: 'use_vsock=false' }
            - { regexp: '^tcp_nodelay=', line: 'tcp_nodelay=true' }
            - { regexp: '^tcp_keepalive=', line: 'tcp_keepalive=true' }
            - { regexp: '^port=', line: "port={{ custom_port | default(3389) }}" }
          notify: restart xrdp

        - name: Enable and start xrdp services
          systemd:
            name: "{{ item }}"
            enabled: true
            state: started
          loop:
            - xrdp
            - xrdp-sesman

        # Security hardening - Fail2ban synchronization
        - name: Configure fail2ban for SSH
          copy:
            content: |
              [sshd]
              enabled = true
              port = 22
              filter = sshd
              logpath = /var/log/secure
              maxretry = 3
              bantime = 3600
              findtime = 600
            dest: /etc/fail2ban/jail.d/sshd.conf
            mode: '0644'
          notify: restart_fail2ban

        - name: Enable security and monitoring services
          systemd:
            name: "{{ item }}"
            enabled: true
            state: started
          loop:
            - fail2ban
            - dnf-automatic.timer
          ignore_errors: true

        - name: Set hostname
          hostname:
            name: "{{ hostname | default('fedora-rdp') }}"
          when: hostname is defined

        - name: Update /etc/hosts with hostname
          lineinfile:
            path: /etc/hosts
            regexp: '^127\.0\.0\.1'
            line: "127.0.0.1 {{ hostname | default(ansible_facts['hostname']) }} localhost"
          when: hostname is defined

        - name: Configure proxy settings
          include_tasks: tasks/proxy_config.yml
          when: proxy_config is defined

        - name: Configure Tailscale VPN
          include_tasks: tasks/tailscale_linux.yml
          when: tailscale_config is defined

        - name: Notify API - Success
          uri:
            url: "{{ api_url }}/vm/{{ vm_id }}/status"
            method: POST
            headers:
              Authorization: "Bearer {{ api_key }}"
              Content-Type: "application/json"
            body_format: json
            body:
              vm_id: "{{ vm_id }}"
              status: "configured"
              os_template: "{{ os_template | default('fedora-rdp') }}"
              management_type: "managed"
              rdp_configured: true
            status_code: [200, 201]
            validate_certs: true
            timeout: 30
          no_log: true
          when:
            - api_url is defined
            - vm_id is defined
          delegate_to: localhost
          become: false

        - name: Permanently disable SSH after playbook completion
          shell: "nohup bash -c 'sleep 5 && systemctl stop sshd && systemctl disable sshd' > /dev/null 2>&1 &"
          ignore_errors: true

      rescue:
        - name: Notify API - Failure
          uri:
            url: "{{ api_url }}/vm/{{ vm_id }}/status"
            method: POST
            headers:
              Authorization: "Bearer {{ api_key }}"
              Content-Type: "application/json"
            body_format: json
            body:
              vm_id: "{{ vm_id }}"
              status: "failed"
              error: "{{ ansible_failed_task.name | default('Unknown task') }} failed"
            validate_certs: true
          no_log: true
          delegate_to: localhost
          become: false
          ignore_errors: true

        - name: Force failure after notification
          fail:
            msg: "Provisioning failed during task: {{ ansible_failed_task.name | default('Unknown') }}"

  handlers:
    - name: restart xrdp
      systemd:
        name: "{{ item }}"
        state: restarted
      loop:
        - xrdp
        - xrdp-sesman

    - name: restart_fail2ban
      systemd:
        name: fail2ban
        state: restarted


