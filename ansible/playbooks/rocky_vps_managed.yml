---
- name: Configure Rocky Linux VPS MANAGED
  hosts: linux
  become: true

  pre_tasks:
    - name: Ensure root_password is defined
      fail:
        msg: "root_password must be defined for security reasons."
      when: root_password is not defined

  vars:
    new_root_password: "{{ root_password }}"
    api_url: "{{ api_url | default('http://localhost:4000') }}"
    proxy_server: "{{ proxy_config.protocol }}://{{ proxy_config.proxy_username | default('') }}:{{ proxy_config.proxy_password | default('') }}@{{ proxy_config.proxy_ip }}:{{ proxy_config.proxy_port }}"
    no_proxy: "{{ proxy_config.no_proxy | default('localhost,127.0.0.1,10.0.0.0/8,192.168.0.0/16,172.16.0.0/12') }}"
    proxy_username: "{{ proxy_config.proxy_username | default('') }}"
    proxy_password: "{{ proxy_config.proxy_password | default('') }}"

  tasks:
    - block:
        - name: Verify basic connectivity
          ping:
          register: connectivity_check

        - name: Gather system facts after connectivity verified
          setup:

        - name: Install proxychains
          dnf:
            name: proxychains-ng
            state: present
          when: proxy_config is defined

        - name: Configure proxychains
          copy:
            content: |
              # proxychains.conf  VER 4.x
              strict_chain
              proxy_dns
              tcp_read_time_out 15000
              tcp_connect_time_out 8000
              [ProxyList]
              {{ proxy_config.protocol }} {{ proxy_config.proxy_ip }} {{ proxy_config.proxy_port }} {{ proxy_username }} {{ proxy_password }}
            dest: /etc/proxychains4.conf
            mode: "0644"
            backup: yes
          when: proxy_config is defined

        - name: Create proxychains wrapper script
          copy:
            content: |
              #!/bin/bash
              exec proxychains4 "$@"
            dest: /usr/local/bin/proxy
            mode: "0755"
          when: proxy_config is defined

        - name: Grow root disk to fill the provisioned storage
          include_tasks: tasks/grow_disk.yml

        - name: Update package cache
          dnf:
            update_cache: yes

        - name: Set root password
          user:
            name: root
            password: "{{ new_root_password | password_hash('sha512') }}"
            update_password: always
          no_log: true

        - name: Install SELinux management tools
          dnf:
            name: policycoreutils-python-utils
            state: present
          ignore_errors: true

        - name: Disable sshd.socket (use sshd service directly)
          systemd:
            name: sshd.socket
            state: stopped
            enabled: no
          ignore_errors: true

        - name: Ensure sshd service is enabled
          systemd:
            name: sshd
            enabled: yes

        - name: Add SELinux ssh_port_t with seport
          seport:
            ports: "{{ custom_port | default(22) }}"
            proto: tcp
            setype: ssh_port_t
            state: present
          when: custom_port is defined

        - name: Check if firewalld is running
          command: systemctl is-active firewalld
          register: firewalld_status
          failed_when: false
          changed_when: false

        - name: Allow custom SSH port in firewalld
          ansible.posix.firewalld:
            port: "{{ custom_port | default(22) }}/tcp"
            permanent: yes
            state: enabled
            immediate: yes
          when: firewalld_status.stdout == 'active' and custom_port is defined

        - name: Configure SSH to use custom port
          lineinfile:
            path: /etc/ssh/sshd_config
            regexp: "^#?Port "
            line: "Port {{ custom_port | default(22) }}"
          notify: restart_ssh

        - name: Create hostname user with root password
          user:
            name: "{{ hostname }}"
            password: "{{ new_root_password | password_hash('sha512') }}"
            groups: wheel
            shell: /bin/bash
            create_home: yes
            state: present
          no_log: true
          when: hostname is defined

        - name: Set hostname
          hostname:
            name: "{{ hostname }}"
          when: hostname is defined

        - name: Update /etc/hosts with hostname
          lineinfile:
            path: /etc/hosts
            regexp: '^127\.0\.0\.1'
            line: "127.0.0.1 {{ hostname | default(ansible_facts['hostname']) }} localhost"
          when: hostname is defined

        - name: Enable EPEL repository
          dnf:
            name: epel-release
            state: present

        - name: Install basic packages
          dnf:
            name:
              - htop
              - curl
              - wget
              - vim
              - git
              - dnf-automatic
              - fail2ban
              - tar
            state: present

        - name: Create prometheus user
          user:
            name: prometheus
            shell: /sbin/nologin
            home: /var/lib/prometheus
            create_home: no
            system: yes

        - name: Create directories for node exporter
          file:
            path: "{{ item }}"
            state: directory
            owner: prometheus
            group: prometheus
            mode: "0755"
          loop:
            - /var/lib/prometheus
            - /etc/prometheus

        - name: Download and install node exporter
          block:
            - name: Get latest node exporter version
              uri:
                url: https://api.github.com/repos/prometheus/node_exporter/releases/latest
                return_content: yes
              register: node_exporter_release

            - name: Set node exporter version
              set_fact:
                node_exporter_version: "{{ node_exporter_release.json.tag_name | regex_replace('^v', '') }}"

            - name: Download node exporter
              get_url:
                url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
                dest: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
                timeout: 30

            - name: Extract node exporter
              unarchive:
                src: "/tmp/node_exporter-{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
                dest: /tmp
                remote_src: yes

            - name: Copy node exporter binary
              copy:
                src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
                dest: /usr/local/bin/node_exporter
                mode: "0755"
                owner: prometheus
                group: prometheus
                remote_src: yes

            - name: Create node exporter systemd service
              copy:
                content: |
                  [Unit]
                  Description=Node Exporter
                  Wants=network-online.target
                  After=network-online.target

                  [Service]
                  User=prometheus
                  Group=prometheus
                  Type=simple
                  ExecStart=/usr/local/bin/node_exporter --web.listen-address=:59100
                  Restart=always
                  RestartSec=3

                  [Install]
                  WantedBy=multi-user.target
                dest: /etc/systemd/system/node_exporter.service
                mode: "0644"

            - name: Reload systemd
              systemd:
                daemon_reload: yes

          rescue:
            - name: Log node exporter installation failure
              debug:
                msg: "Node exporter installation failed, continuing without it"

        - name: Configure dnf-automatic for unattended upgrades
          copy:
            content: |
              [commands]
              upgrade_type = security
              random_sleep = 0
              network_online_timeout = 60
              download_updates = yes
              apply_updates = yes
              [emitters]
              emit_via = stdio
              [email]
              email_from = root@{{ ansible_hostname }}
              email_to = root
              email_host = localhost
              [base]
              debuglevel = 1
            dest: /etc/dnf/automatic.conf
            mode: "0644"
            backup: yes

        - name: Configure fail2ban for SSH
          copy:
            content: |
              [sshd]
              enabled = true
              port = {{ custom_port | default(22) }}
              filter = sshd
              logpath = /var/log/secure
              maxretry = 3
              bantime = 3600
              findtime = 600
            dest: /etc/fail2ban/jail.d/sshd.conf
            mode: '0644'
          notify: restart_fail2ban

        - name: Enable security services
          systemd:
            name: "{{ item }}"
            enabled: yes
            state: started
          loop:
            - node_exporter
            - fail2ban
            - dnf-automatic.timer
          ignore_errors: true

        - name: Send status to API
          uri:
            url: "{{ api_url }}/vm/{{ vm_id }}/status"
            method: POST
            headers:
              Authorization: "Bearer {{ api_key }}"
              Content-Type: "application/json"
            body_format: json
            body:
              status: "configured"
              vm_id: "{{ vm_id }}"
            status_code: [200, 201]
            validate_certs: yes
          register: api_response
          failed_when: false

        - name: Log configuration completion
          debug:
            msg: "Rocky Linux VPS Configuration Complete"

      rescue:
        - name: Notify API - Failure
          uri:
            url: "{{ api_url }}/vm/{{ vm_id }}/status"
            method: POST
            headers:
              Authorization: "Bearer {{ api_key }}"
              Content-Type: "application/json"
            body_format: json
            body:
              status: "failed"
              vm_id: "{{ vm_id | default('unknown') }}"
              error: "{{ ansible_failed_task.name | default('Unknown task') }} failed"
            status_code: [200, 201]
            validate_certs: yes
          delegate_to: localhost
          become: no
          ignore_errors: true

        - name: Force failure after notification
          fail:
            msg: "Provisioning failed during task: {{ ansible_failed_task.name | default('Unknown') }}"

  handlers:
    - name: restart_fail2ban
      systemd:
        name: fail2ban
        state: restarted

    - name: restart_ssh
      systemd:
        name: sshd
        state: restarted
      async: 10
      poll: 0
