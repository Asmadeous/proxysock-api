---
- name: Configure Debian VPS MANAGED
  hosts: linux
  become: yes
  gather_facts: no

  pre_tasks:
    - name: Ensure root_password is defined
      fail:
        msg: "root_password must be defined for security reasons."
      when: root_password is not defined

    - name: Wait for system to stabilize
      pause:
        seconds: 30
      run_once: true

  vars:
    new_user: "{{ hostname | default('vps-user') }}"
    new_root_password: "{{ root_password }}"
    api_url: "{{ api_url | default('http://localhost:4000') }}"
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_timeout: 120
    ansible_command_timeout: 1200
    node_exporter_port: 59100

  tasks:
    - block:
        - name: Establish SSH connection with extended wait
          wait_for_connection:
            timeout: 900
            delay: 30
            connect_timeout: 30

        - name: Gather facts after connectivity verified
          setup:

        - name: Update package cache
          apt:
            update_cache: yes
            cache_valid_time: 3600
          environment:
            DEBIAN_FRONTEND: noninteractive
          retries: 5
          delay: 10

        - name: Install essential packages and monitoring tools
          apt:
            name:
              - curl
              - wget
              - vim
              - git
              - net-tools
              - openssh-client
              - openssh-server
              - fail2ban
              - unattended-upgrades
              - apt-listchanges
              - prometheus-node-exporter
            state: present
          environment:
            DEBIAN_FRONTEND: noninteractive
          retries: 3
          delay: 10

        - name: Create user account
          user:
            name: "{{ new_user }}"
            password: "{{ new_root_password | password_hash('sha512') }}"
            shell: /bin/bash
            state: present
            groups: sudo
            append: yes
          no_log: true

        - name: Enable passwordless sudo for user
          copy:
            content: "{{ new_user }} ALL=(ALL) NOPASSWD:ALL\n"
            dest: "/etc/sudoers.d/{{ new_user }}"
            mode: '0440'
            validate: 'visudo -cf %s'

        - name: Set root password securely
          user:
            name: root
            password: "{{ new_root_password | password_hash('sha512') }}"
            update_password: always
          no_log: true

        - name: Configure SSH to use custom port
          lineinfile:
            path: /etc/ssh/sshd_config
            regexp: '^#?Port '
            line: "Port {{ custom_port | default(22) }}"
          notify: restart_ssh

        - name: Set hostname if provided
          hostname:
            name: "{{ hostname | default('debian-vps') }}"
          when: hostname is defined

        - name: Update /etc/hosts with hostname
          lineinfile:
            path: /etc/hosts
            regexp: '^127\.0\.1\.1'
            line: "127.0.1.1 {{ hostname | default(ansible_facts['hostname']) }}"
          when: hostname is defined

        - name: Configure proxy settings
          include_tasks: tasks/proxy_config.yml
          when: proxy_config is defined

        - name: Configure Tailscale VPN
          include_tasks: tasks/tailscale_linux.yml
          when: tailscale_config is defined

        # ── Monitoring ────────────────────────────────────────────────────────

        - name: Configure Prometheus Node Exporter to listen on custom port
          copy:
            content: |
              ARGS="--web.listen-address=:{{ node_exporter_port }}"
            dest: /etc/default/prometheus-node-exporter
            mode: '0644'
          notify: restart_node_exporter

        - name: Create textfile collector directory
          file:
            path: /var/lib/prometheus/node-exporter
            state: directory
            owner: prometheus
            group: prometheus
            mode: '0755'
          ignore_errors: true

        - name: Create custom VM metrics script
          copy:
            content: |
              #!/bin/bash
              METRICS_FILE="/var/lib/prometheus/node-exporter/vm_info.prom"
              cat > "${METRICS_FILE}.tmp" <<EOF
              # HELP vm_info VM metadata information
              # TYPE vm_info gauge
              vm_info{vm_id="{{ vm_id | default('unknown') }}",hostname="{{ hostname | default('unknown') }}",os="debian",management_type="{{ management_type | default('managed') }}"} 1
              EOF
              mv "${METRICS_FILE}.tmp" "${METRICS_FILE}"
            dest: /usr/local/bin/vm_metrics.sh
            mode: '0755'

        - name: Set up cron job for VM metrics
          cron:
            name: "VM metrics collection"
            minute: "*/5"
            job: "/usr/local/bin/vm_metrics.sh"
            user: root

        - name: Configure unattended upgrades
          copy:
            content: |
              Unattended-Upgrade::Origins-Pattern {
                "origin=Debian,codename=${distro_codename},label=Debian-Security";
                "o=Debian,a=${distro_codename}-updates";
              };

              Unattended-Upgrade::Package-Blacklist {
              };

              Unattended-Upgrade::AutoFixInterruptedDpkg "true";
              Unattended-Upgrade::MinimalSteps "true";
              Unattended-Upgrade::InstallOnShutdown "false";
              Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
              Unattended-Upgrade::Remove-New-Unused-Dependencies "true";
              Unattended-Upgrade::Remove-Unused-Dependencies "true";
              Unattended-Upgrade::Automatic-Reboot "false";
              Unattended-Upgrade::Automatic-Reboot-WithUsers "false";
              Unattended-Upgrade::Automatic-Reboot-Time "02:00";
              Unattended-Upgrade::SyslogEnable "true";
            dest: /etc/apt/apt.conf.d/50unattended-upgrades
            mode: '0644'
            backup: yes

        - name: Enable unattended upgrades
          lineinfile:
            path: /etc/apt/apt.conf.d/20auto-upgrades
            regexp: "{{ item.regexp }}"
            line: "{{ item.line }}"
            create: yes
          loop:
            - { regexp: '^APT::Periodic::Update-Package-Lists', line: 'APT::Periodic::Update-Package-Lists "1";' }
            - { regexp: '^APT::Periodic::Unattended-Upgrade', line: 'APT::Periodic::Unattended-Upgrade "1";' }
            - { regexp: '^APT::Periodic::AutocleanInterval', line: 'APT::Periodic::AutocleanInterval "7";' }

        - name: Configure fail2ban
          copy:
            content: |
              [sshd]
              enabled = true
              port = ssh
              filter = sshd
              logpath = /var/log/auth.log
              maxretry = 3
              bantime = 3600
              findtime = 600
            dest: /etc/fail2ban/jail.d/sshd.conf
            mode: '0644'
          notify: restart_fail2ban

        - name: Ensure monitoring and security services are running
          systemd:
            name: "{{ item }}"
            enabled: yes
            state: started
          loop:
            - prometheus-node-exporter
            - fail2ban
            - unattended-upgrades

        - name: Check if reboot is required (info only)
          stat:
            path: /var/run/reboot-required
          register: reboot_required_file

        - name: Reboot if needed
          reboot:
            reboot_timeout: 600
          when: reboot_required_file.stat.exists

        - name: Verify services are running
          systemd:
            name: "{{ item }}"
            state: started
          loop:
            - prometheus-node-exporter
            - fail2ban
            - unattended-upgrades
          register: service_verification

        - name: Send status to management API
          uri:
            url: "{{ api_url }}/vm/{{ vm_id }}/status"
            method: POST
            headers:
              Authorization: "Bearer {{ api_key }}"
              Content-Type: "application/json"
            body_format: json
            body:
              status: "configured"
              vm_id: "{{ vm_id }}"
              hostname: "{{ hostname | default(ansible_facts['hostname']) }}"
              os_template: "{{ os_template | default('debian') }}"
              management_type: "{{ management_type | default('managed') }}"
              connectivity_status: "working"
              services_verified: "{{ service_verification.results | map(attribute='name') | list }}"
              configuration_timestamp: "{{ ansible_facts['date_time']['iso8601'] | default('unknown') }}"
              proxy_configured: "{{ proxy_config is defined }}"
              monitoring_enabled: true
              unattended_upgrades_enabled: true
            status_code: [200, 201]
            validate_certs: yes
            timeout: 30
          no_log: true
          when:
            - api_url is defined
            - vm_id is defined
          delegate_to: localhost
          become: no
          register: api_response
          failed_when: false
          ignore_errors: yes

        - name: Log configuration completion
          debug:
            msg: |
              Debian VPS MANAGED Configuration Complete:
              - VM ID: {{ vm_id | default('Unknown') }}
              - Hostname: {{ hostname | default(ansible_facts['hostname']) }}
              - User created: {{ new_user }}
              - Connectivity: Working
              - Proxy Configured: {{ proxy_config is defined }}
              - Services: {{ service_verification.results | map(attribute='name') | list }}
              - Monitoring: Enabled (prometheus-node-exporter, node_exporter_port={{ node_exporter_port }})
              - Unattended Updates: Enabled
              - API Response: {{ api_response.status | default('No response') }}

        - name: Final configuration step
          shell: |
            echo "=== Debian VPS MANAGED Configuration Complete ==="
            echo "✅ Root password updated"
            echo "✅ User '{{ new_user }}' created with sudo access"
            echo "✅ Hostname configured: {{ hostname | default(ansible_facts['hostname']) }}"
            echo "✅ Essential packages installed"
            echo "✅ Monitoring enabled (Prometheus Node Exporter :{{ node_exporter_port }})"
            echo "✅ Security hardening (fail2ban, unattended-upgrades)"
            echo "✅ Proxy configured: {{ 'Yes' if proxy_config is defined else 'No' }}"
            echo ""
            echo "Configuration complete"

      rescue:
        - name: Notify API - Failure
          uri:
            url: "{{ api_url }}/vm/{{ vm_id }}/status"
            method: POST
            headers:
              Authorization: "Bearer {{ api_key }}"
              Content-Type: "application/json"
            body_format: json
            body:
              vm_id: "{{ vm_id }}"
              status: "failed"
              os_template: "{{ os_template | default('debian') }}"
              management_type: "{{ management_type | default('managed') }}"
              error: "{{ ansible_failed_task.name | default('Unknown task') }} failed: {{ ansible_failed_result.msg | default('No error message') }}"
              failed_at: "{{ ansible_facts['date_time']['iso8601'] | default('unknown') }}"
            status_code: [200, 201]
            validate_certs: yes
            timeout: 30
          no_log: true
          when:
            - api_url is defined
            - vm_id is defined
          delegate_to: localhost
          become: no
          ignore_errors: yes

        - name: Final failure notification
          debug:
            msg:
              - "❌ Debian VPS MANAGED Configuration FAILED!"
              - "❌ VM ID: {{ vm_id | default('unknown') }}"
              - "❌ Task: {{ ansible_failed_task.name | default('Unknown') }}"
              - "❌ Error: {{ ansible_failed_result.msg | default('Unknown error') }}"

  handlers:
    - name: restart_ssh
      systemd:
        name: ssh
        state: restarted

    - name: restart_fail2ban
      systemd:
        name: fail2ban
        state: restarted

    - name: restart_node_exporter
      systemd:
        name: prometheus-node-exporter
        state: restarted

    - name: reload systemd
      systemd:
        daemon_reload: yes