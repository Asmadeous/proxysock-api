---
- name: Configure Debian VPS UNMANAGED
  hosts: linux
  become: yes
  gather_facts: no

  vars:
    new_root_password: "{{ root_password | default('SecurePass123!') }}"
    new_user: "{{ hostname | default('vps-user') }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=password -o PubkeyAuthentication=no'

  tasks:
    - block:
        - name: Establish SSH connection
          wait_for_connection:
            timeout: 600
            delay: 10
          register: ssh_result
          failed_when: ssh_result is failed
          changed_when: false

        - name: Debug SSH connection
          debug:
            msg: "{{ ssh_result }}"

        - name: Gather facts
          setup:

        - name: Create new user
          user:
            name: "{{ new_user }}"
            password: "{{ new_root_password | password_hash('sha512') }}"
            shell: /bin/bash
            state: present

        - name: Update packages
          apt:
            update_cache: yes

        - name: Set root password
          user:
            name: root
            password: "{{ new_root_password | password_hash('sha512') }}"

        - name: Set hostname
          hostname:
            name: "{{ hostname }}"

        - name: Install basic packages
          apt:
            name:
              - curl
              - wget
            state: present
            update_cache: yes
          retries: 3
          delay: 10

        - name: Final configuration step
          shell: |
            echo "=== Debian VPS Configuration Complete ==="
            echo "✅ User '{{ new_user }}' created"
            echo "✅ Root password updated"
            echo "✅ Hostname set to '{{ hostname }}'"
            echo "✅ Basic packages installed"
            echo ""
            echo "Configuration complete"

        - name: Notify API - Success
          uri:
            url: "{{ api_url }}/vm/{{ vm_id }}/status"
            method: POST
            headers:
              Authorization: "Bearer {{ api_key }}"
              Content-Type: "application/json"
            body_format: json
            body:
              vm_id: "{{ vm_id }}"
              status: "configured"
              os_template: "{{ os_template | default('debian') }}"
              management_type: "{{ management_type | default('unmanaged') }}"
              admin_configured: true
              configuration_completed_at: "{{ ansible_date_time.iso8601 }}"
            status_code: [200, 201, 202]
            timeout: 30
          when:
            - api_url is defined
            - api_key is defined
            - vm_id is defined
          delegate_to: localhost
          ignore_errors: yes

      rescue:
        - name: Notify API - Failure
          uri:
            url: "{{ api_url }}/vm/{{ vm_id }}/status"
            method: POST
            headers:
              Authorization: "Bearer {{ api_key }}"
              Content-Type: "application/json"
            body_format: json
            body:
              vm_id: "{{ vm_id }}"
              status: "failed"
              os_template: "{{ os_template | default('debian') }}"
              management_type: "{{ management_type | default('unmanaged') }}"
              error: "{{ ansible_failed_task.name | default('Unknown task') }} failed: {{ ansible_failed_result.msg | default('No error message') }}"
              failed_at: "{{ ansible_date_time.iso8601 }}"
            status_code: [200, 201, 202]
            timeout: 30
          when:
            - api_url is defined
            - api_key is defined
            - vm_id is defined
          delegate_to: localhost
          ignore_errors: yes

        - name: Final failure notification
          debug:
            msg:
              - "❌ Debian VPS Configuration FAILED!"
              - "❌ VM ID: {{ vm_id | default('unknown') }}"
              - "❌ Task: {{ ansible_failed_task.name | default('Unknown') }}"
              - "❌ Error: {{ ansible_failed_result.msg | default('Unknown error') }}"