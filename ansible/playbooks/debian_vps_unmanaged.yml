---
- name: Configure Debian VPS UNMANAGED
  hosts: linux
  become: yes
  gather_facts: no

  pre_tasks:
    - name: Ensure root_password is defined
      fail:
        msg: "root_password must be defined for security reasons."
      when: root_password is not defined

  vars:
    new_root_password: "{{ root_password }}"
    new_user: "{{ hostname | default('vps-user') }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=password -o PubkeyAuthentication=no'

  tasks:
    - block:
        - name: Establish SSH connection
          wait_for_connection:
            timeout: 600
            delay: 10
          register: ssh_result
          failed_when: ssh_result is failed
          changed_when: false

        - name: Debug SSH connection
          debug:
            msg: "{{ ssh_result }}"

        - name: Gather facts
          setup:

        - name: Create new user
          user:
            name: "{{ new_user }}"
            password: "{{ new_root_password | password_hash('sha512') }}"
            shell: /bin/bash
            state: present
          no_log: true

        - name: Update packages
          apt:
            update_cache: yes

        - name: Set root password
          user:
            name: root
            password: "{{ new_root_password | password_hash('sha512') }}"
          no_log: true

        - name: Configure SSH to use custom port
          lineinfile:
            path: /etc/ssh/sshd_config
            regexp: '^#?Port '
            line: "Port {{ custom_port | default(22) }}"
          notify: restart_ssh

        - name: Set hostname
          hostname:
            name: "{{ hostname }}"

        - name: Install basic packages
          apt:
            name:
              - curl
              - wget
              - fail2ban
              - unattended-upgrades
            state: present
            update_cache: yes
          retries: 3
          delay: 10

        - name: Ensure security services are running
          systemd:
            name: "{{ item }}"
            enabled: yes
            state: started
          loop:
            - fail2ban
            - unattended-upgrades
          ignore_errors: yes

        - name: Final configuration step
          shell: |
            echo "=== Debian VPS Configuration Complete ==="
            echo "✅ User '{{ new_user }}' created"
            echo "✅ Root password updated"
            echo "✅ Hostname set to '{{ hostname }}'"
            echo "✅ Basic packages installed"
            echo ""
            echo "Configuration complete"

        - name: Notify API - Success
          uri:
            url: "{{ api_url }}/vm/{{ vm_id }}/status"
            method: POST
            headers:
              Authorization: "Bearer {{ api_key }}"
              Content-Type: "application/json"
            body_format: json
            body:
              vm_id: "{{ vm_id }}"
              status: "configured"
              os_template: "{{ os_template | default('debian') }}"
              management_type: "{{ management_type | default('unmanaged') }}"
              admin_configured: true
              configuration_completed_at: "{{ ansible_date_time.iso8601 }}"
            status_code: [200, 201, 202]
            validate_certs: yes
            timeout: 30
            no_log: true
          when:
            - api_url is defined
            - vm_id is defined
          delegate_to: localhost
          ignore_errors: yes

      rescue:
        - name: Notify API - Failure
          uri:
            url: "{{ api_url }}/vm/{{ vm_id }}/status"
            method: POST
            headers:
              Authorization: "Bearer {{ api_key }}"
              Content-Type: "application/json"
            body_format: json
            body:
              vm_id: "{{ vm_id }}"
              status: "failed"
              os_template: "{{ os_template | default('debian') }}"
              management_type: "{{ management_type | default('unmanaged') }}"
              error: "{{ ansible_failed_task.name | default('Unknown task') }} failed: {{ ansible_failed_result.msg | default('No error message') }}"
              failed_at: "{{ ansible_date_time.iso8601 }}"
            status_code: [200, 201, 202]
            validate_certs: yes
            timeout: 30
            no_log: true
          when:
            - api_url is defined
            - vm_id is defined
          delegate_to: localhost
          ignore_errors: yes

        - name: Final failure notification
          debug:
            msg:
              - "❌ Debian VPS Configuration FAILED!"
              - "❌ VM ID: {{ vm_id | default('unknown') }}"
              - "❌ Task: {{ ansible_failed_task.name | default('Unknown') }}"
              - "❌ Error: {{ ansible_failed_result.msg | default('Unknown error') }}"

  handlers:
    - name: restart_ssh
      systemd:
        name: ssh
        state: restarted