- name: Configure Windows VPS Managed (Via RDP)
  hosts: windows
  gather_facts: no
  vars:
    rdp_username: "{{ rdp_username | default('rdpuser') }}"
    rdp_password: "{{ rdp_password | default('SecurePass123!') }}"
    api_url: "{{ api_url | default('http://localhost:4000') }}"
    api_key: "{{ api_key | default('your_api_key') }}"
  tasks:
    - block:
        - name: Wait for WinRM
          win_ping:
          retries: 30
          delay: 10

        - name: Gather facts
          setup:

        - name: Install Windows updates
          win_updates:
            category_names:
              - SecurityUpdates
              - CriticalUpdates
              - UpdateRollups
            state: installed
            reboot: yes
          register: update_result

        - name: Create RDP user
          win_user:
            name: "{{ rdp_username }}"
            password: "{{ rdp_password }}"
            state: present
            groups:
              - Remote Desktop Users
              - Users

        - name: Enable RDP
          win_regedit:
            path: HKLM:\System\CurrentControlSet\Control\Terminal Server
            name: fDenyTSConnections
            data: 0
            type: dword

        - name: Enable RDP through firewall
          win_firewall_rule:
            name: Remote Desktop
            enabled: yes
            state: present

        - name: Set hostname
          win_hostname:
            name: "{{ hostname }}"
          register: hostname_result

        - name: Install monitoring (managed)
          win_chocolatey:
            name: prometheus-windows-exporter
            state: present

        - name: Reboot if needed
          win_reboot:
          when: hostname_result.reboot_required or update_result.reboot_required

        - name: Send status to API
          win_uri:
            url: "{{ api_url }}/vm/{{ vm_id }}/status"
            method: POST
            headers:
              Authorization: "Bearer {{ api_key }}"
              Content-Type: application/json
            body: "{{ {'status': 'configured', 'vm_id': vm_id, 'os_template': os_template, 'management_type': management_type} | to_json }}"
            status_code: 200
          when: api_url is defined and api_key is defined

        - name: Final configuration step
          win_shell: Write-Output "Configuration complete"
          
        - name: Notify API - Success
          uri:
            url: "{{ api_url }}/vm/{{ vm_id }}/status"
            method: POST
            headers:
              Authorization: "Bearer {{ api_key }}"
              Content-Type: "application/json"
            body_format: json
            body:
              vm_id: "{{ vm_id }}"
              status: "configured"
              os_template: "{{ os_template }}"
              management_type: "{{ management_type }}"
          delegate_to: localhost

      rescue:
        - name: Notify API - Failure
          uri:
            url: "{{ api_url }}/vm/{{ vm_id }}/status"
            method: POST
            headers:
              Authorization: "Bearer {{ api_key }}"
              Content-Type: "application/json"
            body_format: json
            body:
              vm_id: "{{ vm_id }}"
              status: "failed"
              os_template: "{{ os_template }}"
              management_type: "{{ management_type }}"
              error: "{{ ansible_failed_task.name | default('Unknown task') }} failed: {{ ansible_failed_result.msg | default('No error message') }}"
          delegate_to: localhost
          ignore_errors: yes