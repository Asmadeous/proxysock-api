services:
  web-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # Automatically prepares all 4 databases (primary, cache, queue, cable)
    command: >
      bash -c "bin/rails db:prepare && 
               rm -f tmp/pids/server.pid && 
               bundle exec rails s -b 0.0.0.0"
    volumes:
      - .:/home/asmadeous/Work/proxysock-api:cached
      - rails_bundle_2026:/usr/local/bundle
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=host.docker.internal
      - DB_USERNAME=asmadeous
      - DB_PASSWORD=Asmadeous@2025
      - RAILS_ENV=development
    profiles: [ "dev" ]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - default

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=proxysock2026
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped


volumes:
  rails_bundle_2026:
  prometheus_data:
  grafana_data:
