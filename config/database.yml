default: &default
  adapter: postgresql
  encoding: unicode
  # Use DB_HOST env var (set in Docker), fallback to localhost for local development
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: 5432
  username: <%= ENV.fetch("DB_USERNAME", "asmadeous") %>
  password: <%= ENV.fetch("DB_PASSWORD", "Asmadeous@2025") %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  primary:
    <<: *default
    database: proxysock_api_development
  cache:
    <<: *default
    database: proxysock_api_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: proxysock_api_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: proxysock_api_cable
    migrations_paths: db/cable_migrate

test:
  <<: *default
  database: proxysock_api_test

production:
  primary: &primary_production
    <<: *default
    host: db-production # Matches service name in production compose
    database: proxysock_api_production
    username: proxysock_api
    password: <%= ENV["PROXYSOCK_API_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: proxysock_api_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: proxysock_api_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: proxysock_api_production_cable
    migrations_paths: db/cable_migrate
