default: &default
  adapter: postgresql
  encoding: unicode
  # Use env vars for host/credentials. Omit host to use Unix socket (peer auth).
  # For TCP connections, set DB_HOST=localhost and provide DB_PASSWORD.
  host: <%= ENV["DB_HOST"] %>
  port: 5432
  username: <%= ENV.fetch("DB_USERNAME", ENV["USER"]) %>
  password: <%= ENV["DB_PASSWORD"] %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  primary:
    <<: *default
    database: proxysock_api_development
  cache:
    <<: *default
    database: proxysock_api_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: proxysock_api_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: proxysock_api_cable
    migrations_paths: db/cable_migrate

test:
  primary:
    <<: *default
    database: proxysock_api_test
  cache:
    <<: *default
    database: proxysock_api_test_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: proxysock_api_test_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: proxysock_api_test_cable
    migrations_paths: db/cable_migrate

production:
  primary: &primary_production
    <<: *default
    host: db-production # Matches service name in production compose
    database: proxysock_api_production
    username: proxysock_api
    password: <%= ENV["PROXYSOCK_API_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: proxysock_api_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: proxysock_api_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: proxysock_api_production_cable
    migrations_paths: db/cable_migrate
