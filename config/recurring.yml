staging:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  expiration_cleanup:
    class: ExpirationCleanupJob
    schedule: every hour

  billing_renewal:
    class: BillingRenewalWorker
    schedule: at 12am every day

  inventory_restock:
    class: InventoryRestockWorker
    schedule: at 6am every day

  product_sync:
    class: ProductSyncJob
    schedule: every 6 hours

  esim_sync:
    class: EsimSyncJob
    schedule: every 30 minutes

  proxmox_backup:
    class: ProxmoxBackupJob
    schedule: "0 2 */3 * *"

  vm_garbage_collection:
    class: VmGarbageCollectionJob
    schedule: at 3am every day

