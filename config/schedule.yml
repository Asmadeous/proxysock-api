expiration_cleanup:
  cron: "0 * * * *"   # Every hour
  class: "ExpirationCleanupJob"

billing_renewal:
  cron: "0 0 * * *"   # Every day at midnight
  class: "BillingRenewalWorker"

inventory_restock:
  cron: "0 6 * * *"   # Every day at 6 AM
  class: "InventoryRestockWorker"

product_sync:
  cron: "0 */6 * * *" # Every 6 hours
  class: "ProductSyncJob"

esim_sync:
  cron: "*/30 * * * *" # Every 30 minutes
  class: "EsimSyncJob"

proxmox_backup:
  cron: "0 2 */3 * *"  # Every 3 days at 2 AM
  class: "ProxmoxBackupJob"

