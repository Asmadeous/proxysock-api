expiration_cleanup:
  cron: "0 * * * *"   # Every hour
  class: "ExpirationCleanupJob"

billing_renewal:
  cron: "0 0 * * *"   # Every day at midnight
  class: "BillingRenewalWorker"

product_sync:
  cron: "0 */6 * * *" # Every 6 hours
  class: "ProductSyncJob"

esim_sync:
  cron: "*/30 * * * *" # Every 30 minutes
  class: "EsimSyncJob"

proxmox_backup:
  cron: "0 2 */3 * *"  # Every 3 days at 2 AM
  class: "ProxmoxBackupJob"

vm_garbage_collection:
  cron: "0 3 * * *"    # Every day at 3 AM
  class: "VmGarbageCollectionJob"

infrastructure_monthly_billing:
  cron: "0 1 1 * *"    # 1st of every month at 1 AM
  class: "InfrastructureMonthlyBillingJob"

localtonet_bandwidth_sync:
  cron: "*/15 * * * *" # Every 15 minutes
  class: "LocaltonetBandwidthSyncJob"

resource_alert_check:
  cron: "*/5 * * * *"   # Every 5 minutes
  class: "ResourceAlertCheckJob"

rexpay_reconciliation:
  cron: "*/5 * * * *"   # Every 5 minutes — fallback poller for RexPay (no webhook)
  class: "RexpayReconciliationJob"

esim_topup_renewal:
  cron: "15 * * * *"   # Hourly — charges monthly eSIM auto top-ups that are due
  class: "EsimTopupRenewalJob"

meisim_catalog_sync:
  cron: "15 * * * *"   # Every hour, then clears the product caches
  class: "MeisimCatalogSyncJob"

esim_access_order_poll:
  cron: "*/5 * * * *"   # Every 5 minutes — completes eSIM Access orders whose webhook was missed
  class: "EsimAccessOrderPollJob"

meisim_order_poll:
  cron: "*/5 * * * *"   # Every 5 minutes — MeiSIM has no webhooks
  class: "MeisimOrderPollJob"

meisim_usage_sync:
  cron: "*/30 * * * *"  # Every 30 minutes
  class: "MeisimUsageSyncJob"
