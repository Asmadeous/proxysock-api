<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>${title}</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f6f8;
      font-family:
        -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto,
        &quot;Helvetica Neue&quot;, Arial, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background-color: #f4f6f8"
    >
      <tr>
        <td align="center" style="padding: 40px 20px">
          <table
            role="presentation"
            width="600"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="background-color: #ffffff; max-width: 600px; width: 100%"
          >
            <!-- Header with Logo -->
            <tr>
              <td style="padding: 32px 40px">
                <img
                  src="https://proxysock.com/assets/PROXY%20SOCKS%20DARK%20FONT-BmPlaTFU.png"
                  alt="xHero"
                  width="100"
                  style="
                    display: block;
                    border: 0;
                    outline: none;
                    text-decoration: none;
                    height: auto;
                    -ms-interpolation-mode: bicubic;
                  "
                />
              </td>
            </tr>
            <!-- Content Body -->
            <tr>
              <td
                style="
                  padding: 40px;
                  color: #374151;
                  font-size: 15px;
                  line-height: 1.7;
                "
              >
                ${content}
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td
                style="
                  padding: 32px 40px;
                  text-align: center;
                  font-size: 13px;
                  color: #6b7280;
                "
              >
                <p style="margin: 0 0 8px 0">
                  © ${new Date().getFullYear()} xHero. All rights reserved.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
