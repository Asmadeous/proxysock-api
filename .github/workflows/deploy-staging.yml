name: Deploy Staging

on:
    push:
        branches: [develop]
    workflow_dispatch:

env:
    REGISTRY: ghcr.io
    API_IMAGE: asmadeous/proxysock-api
    CLIENT_IMAGE: asmadeous/proxysock-client

jobs:
    deploy-staging:
        name: Deploy to Staging
        runs-on: ubuntu-latest
        environment: staging

        permissions:
            contents: read
            packages: write

        steps:
            - uses: actions/checkout@v4

            - name: Log in to Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            # ─── Build API Image ───────────────────────────────
            - name: API image metadata
              id: api-meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.API_IMAGE }}
                  tags: |
                      type=sha
                      type=raw,value=staging

            - name: Build and push API image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: ${{ steps.api-meta.outputs.tags }}
                  labels: ${{ steps.api-meta.outputs.labels }}
                  cache-from: type=gha,scope=api
                  cache-to: type=gha,scope=api,mode=max

            # ─── Build Client Image ────────────────────────────
            - name: Client image metadata
              id: client-meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.CLIENT_IMAGE }}
                  tags: |
                      type=sha
                      type=raw,value=staging

            - name: Build and push Client image
              uses: docker/build-push-action@v5
              with:
                  context: ./client
                  file: ./client/Dockerfile
                  push: true
                  tags: ${{ steps.client-meta.outputs.tags }}
                  labels: ${{ steps.client-meta.outputs.labels }}
                  build-args: |
                      VITE_PAYSTACK_PUBLIC_KEY=${{ secrets.VITE_PAYSTACK_PUBLIC_KEY }}
                      VITE_API_URL=${{ secrets.VITE_API_URL }}
                      VITE_RAILS_API_URL=${{ secrets.VITE_RAILS_API_URL }}
                      VITE_WS_URL=${{ secrets.VITE_WS_URL }}
                      VITE_HUNDREDPAY_PUBLIC_KEY=${{ secrets.VITE_HUNDREDPAY_PUBLIC_KEY }}
                      VITE_TAWK_PROPERTY_ID=${{ secrets.VITE_TAWK_PROPERTY_ID }}
                      VITE_TAWK_WIDGET_ID=${{ secrets.VITE_TAWK_WIDGET_ID }}
                  cache-from: type=gha,scope=client
                  cache-to: type=gha,scope=client,mode=max

            # ─── Connect to Tailnet ────────────────────────────
            - name: Connect to Tailscale
              uses: tailscale/github-action@v2
              with:
                  oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
                  oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
                  tags: tag:ci

            # ─── Deploy to VM ──────────────────────────────────
            - name: Copy docker-compose config and monitoring
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.STAGING_TAILSCALE_IP }}
                  username: ${{ secrets.STAGING_USER }}
                  password: ${{ secrets.STAGING_PASSWORD }}
                  port: ${{ secrets.SSH_PORT }}
                  timeout: 60s
                  source: "docker-compose.yml,monitoring/"
                  target: "/opt/proxysock-api"

            - name: Deploy to Staging Server
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.STAGING_TAILSCALE_IP }}
                  username: ${{ secrets.STAGING_USER }}
                  password: ${{ secrets.STAGING_PASSWORD }}
                  port: ${{ secrets.SSH_PORT }}
                  timeout: 60s
                  command_timeout: 60m
                  script: |
                      cd /opt/proxysock-api

                      # Login to GHCR
                      echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

                      # Pull images
                      docker pull ${{ env.REGISTRY }}/${{ env.API_IMAGE }}:staging
                      docker pull ${{ env.REGISTRY }}/${{ env.CLIENT_IMAGE }}:staging

                      # Run migrations
                      IMAGE_TAG=staging docker compose --profile staging run --rm \
                        web-staging bin/rails db:prepare

                      # Restart all staging services
                      IMAGE_TAG=staging docker compose --profile staging up -d --no-deps --remove-orphans \
                        web-staging sidekiq-staging frontend-staging

                      # Health check (API)
                      echo "Waiting for API health check..."
                      for i in $(seq 1 30); do
                        if curl -sfkL --max-time 5 -H "Host: apitest.proxysock.net" http://localhost/up > /dev/null 2>&1; then
                          echo "✅ API healthy!"
                          break
                        fi
                        echo "Attempt $i/30..."
                        sleep 2
                      done

                      # Health check (Frontend)
                      echo "Checking frontend..."
                      if curl -sf --max-time 5 http://localhost:8080/health > /dev/null 2>&1; then
                        echo "✅ Frontend healthy!"
                      else
                        echo "⚠️ Frontend health check failed"
                      fi

            # NOTE: Ansible dependencies are already built into the Docker image.
            # Only uncomment if you need to force-update dependencies on a running container.
            # - name: Install Ansible Dependencies
            #   uses: appleboy/ssh-action@v1.0.3
            #   with:
            #       host: ${{ secrets.STAGING_TAILSCALE_IP }}
            #       username: ${{ secrets.STAGING_USER }}
            #       password: ${{ secrets.STAGING_PASSWORD }}
            #       port: ${{ secrets.SSH_PORT }}
            #       timeout: 60s
            #       command_timeout: 60m
            #       script: |
            #           INSTALL_CMD='apt-get update -qq && apt-get install --no-install-recommends -y python3-pip python3-venv && pip3 install --no-cache-dir --break-system-packages ansible-core==2.20.4 pywinrm requests-credssp && ansible-galaxy collection install ansible.windows:==3.5.0 ansible.posix:==2.1.0 community.windows:==3.1.0 community.general:==12.5.0 chocolatey.chocolatey:==1.5.3 -p /usr/share/ansible/collections --force && rm -rf /var/lib/apt/lists /var/cache/apt/archives'
            #
            #           echo "Installing Ansible deps in sidekiq-staging..."
            #           docker exec -u root proxysock-sidekiq-staging bash -c "$INSTALL_CMD"
            #           echo "✅ sidekiq-staging done"
            #
            #           echo "Installing Ansible deps in web-staging..."
            #           docker exec -u root proxysock-web-staging bash -c "$INSTALL_CMD"
            #           echo "✅ web-staging done"

            - name: Notify deployment
              if: always()
              run: |
                  echo "🚀 Staging deployment completed!"
                  echo "API: ${{ env.REGISTRY }}/${{ env.API_IMAGE }}:staging"
                  echo "Client: ${{ env.REGISTRY }}/${{ env.CLIENT_IMAGE }}:staging"
                  echo "Commit: ${{ github.sha }}"
