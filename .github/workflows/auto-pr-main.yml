name: Auto PR to Main (Release)

on:
    push:
        branches: [develop]
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    create-release-pr:
        name: Create Release PR to Main
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Check for differences
              id: diff
              run: |
                  git fetch origin main
                  DIFF=$(git diff origin/main..HEAD --stat)
                  if [ -z "$DIFF" ]; then
                    echo "has_changes=false" >> $GITHUB_OUTPUT
                  else
                    echo "has_changes=true" >> $GITHUB_OUTPUT
                  fi

            # Open the release PR with gh. peter-evans/create-pull-request treats
            # `branch` as a branch it owns and force-reset develop to main.
            - name: Create Pull Request to Main
              if: steps.diff.outputs.has_changes == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  if [ -n "$(gh pr list --base main --head develop --state open --json number --jq '.[].number')" ]; then
                    echo "Release PR from develop to main is already open"
                    exit 0
                  fi
                  cat > pr-body.md <<'BODY'
                  ## Release PR

                  This PR merges all changes from `develop` into `main` for production deployment.

                  **Source:** `develop`
                  **Target:** `main`

                  ### Pre-deployment Checklist
                  - [ ] All tests passing on staging
                  - [ ] QA approved
                  - [ ] No blocking issues
                  - [ ] Database migrations reviewed

                  ### Post-merge
                  After merging, the production deployment workflow will automatically:
                  1. Build Docker image tagged as `:latest`
                  2. Push to container registry
                  3. Deploy to production (if configured)
                  BODY
                  gh pr create --base main --head develop \
                    --title "🚀 Release: Merge develop into main" --body-file pr-body.md
                  gh pr edit develop --add-label release --add-label production || echo "Labels not added"

            - name: No changes
              if: steps.diff.outputs.has_changes == 'false'
              run: echo "No changes between develop and main"
