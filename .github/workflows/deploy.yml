name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  API_IMAGE: asmadeous/proxysock-api
  CLIENT_IMAGE: asmadeous/proxysock-client

jobs:
  # Wait for CI to pass before deploying
  ci-check:
    name: Verify CI Passed
    runs-on: ubuntu-latest
    permissions:
      checks: read
      statuses: read
      contents: read
    steps:
      - name: Wait for CI
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'Test'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [ci-check]
    environment: production

    steps:
        - uses: actions/checkout@v4

        - name: Log in to Container Registry
          uses: docker/login-action@v3
          with:
              registry: ${{ env.REGISTRY }}
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        # ─── Build API Image ───────────────────────────────
        - name: API image metadata
          id: api-meta
          uses: docker/metadata-action@v5
          with:
              images: ${{ env.REGISTRY }}/${{ env.API_IMAGE }}
              tags: |
                  type=sha
                  type=raw,value=latest

        - name: Build and push API image
          uses: docker/build-push-action@v5
          with:
              context: .
              push: true
              tags: ${{ steps.api-meta.outputs.tags }}
              labels: ${{ steps.api-meta.outputs.labels }}
              cache-from: type=gha,scope=api
              cache-to: type=gha,scope=api,mode=max

        # ─── Build Client Image ────────────────────────────
        - name: Client image metadata
          id: client-meta
          uses: docker/metadata-action@v5
          with:
              images: ${{ env.REGISTRY }}/${{ env.CLIENT_IMAGE }}
              tags: |
                  type=sha
                  type=raw,value=latest

        - name: Build and push Client image
          uses: docker/build-push-action@v5
          with:
              context: ./client
              file: ./client/Dockerfile
              push: true
              tags: ${{ steps.client-meta.outputs.tags }}
              labels: ${{ steps.client-meta.outputs.labels }}
              build-args: |
                  VITE_PAYSTACK_PUBLIC_KEY=${{ secrets.VITE_PAYSTACK_PUBLIC_KEY }}
                  VITE_API_URL=${{ secrets.VITE_API_URL }}
                  VITE_RAILS_API_URL=${{ secrets.VITE_RAILS_API_URL }}
                  VITE_WS_URL=${{ secrets.VITE_WS_URL }}
                  VITE_HUNDREDPAY_PUBLIC_KEY=${{ secrets.VITE_HUNDREDPAY_PUBLIC_KEY }}
              cache-from: type=gha,scope=client
              cache-to: type=gha,scope=client,mode=max

        # ─── Connect to Tailnet ────────────────────────────
        - name: Connect to Tailscale
          uses: tailscale/github-action@v2
          with:
              oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
              oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
              tags: tag:ci

        # ─── Deploy to VM ──────────────────────────────────
        - name: Copy docker-compose config and monitoring
          uses: appleboy/scp-action@v0.1.7
          with:
              host: ${{ secrets.PRODUCTION_TAILSCALE_IP }}
              username: ${{ secrets.PRODUCTION_USER }}
              password: ${{ secrets.PRODUCTION_SSH_PASSWORD }}
              source: "docker-compose.yml,monitoring/"
              target: "/opt/proxysock-api"

        - name: Deploy to Production Server
          uses: appleboy/ssh-action@v1.0.3
          with:
              host: ${{ secrets.PRODUCTION_TAILSCALE_IP }}
              username: ${{ secrets.PRODUCTION_USER }}
              password: ${{ secrets.PRODUCTION_SSH_PASSWORD }}
              script: |
                  cd /opt/proxysock-api

                  # Login to GHCR
                  echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

                  # Pull images
                  docker pull ${{ env.REGISTRY }}/${{ env.API_IMAGE }}:latest
                  docker pull ${{ env.REGISTRY }}/${{ env.CLIENT_IMAGE }}:latest

                  # Run migrations
                  IMAGE_TAG=latest docker compose --profile prod run --rm \
                    web bin/rails db:prepare

                  # Restart all production services
                  IMAGE_TAG=latest docker compose --profile prod up -d --no-deps --remove-orphans \
                    web sidekiq frontend

                  # Health check (API)
                  echo "Waiting for API health check..."
                  for i in $(seq 1 30); do
                    if curl -sf --max-time 5 http://localhost/up > /dev/null 2>&1; then
                      echo "✅ API healthy!"
                      break
                    fi
                    echo "Attempt $i/30..."
                    sleep 2
                  done

                  # Health check (Frontend)
                  echo "Checking frontend..."
                  if curl -sf --max-time 5 http://localhost:8080/health > /dev/null 2>&1; then
                    echo "✅ Frontend healthy!"
                  else
                    echo "⚠️ Frontend health check failed"
                  fi

        # ─── Install Ansible Dependencies ─────────────────
        - name: Install Ansible dependencies in containers
          uses: appleboy/ssh-action@v1.0.3
          with:
              host: ${{ secrets.PRODUCTION_TAILSCALE_IP }}
              username: ${{ secrets.PRODUCTION_USER }}
              password: ${{ secrets.PRODUCTION_SSH_PASSWORD }}
              script: |
                  INSTALL_CMD='apt-get update -qq && apt-get install --no-install-recommends -y python3-pip python3-venv && pip3 install --no-cache-dir --break-system-packages ansible-core==2.20.4 pywinrm requests-credssp && ansible-galaxy collection install ansible.windows:==3.5.0 ansible.posix:==2.1.0 community.windows:==3.1.0 community.general:==12.5.0 chocolatey.chocolatey:==1.5.3 -p /usr/share/ansible/collections --force && rm -rf /var/lib/apt/lists /var/cache/apt/archives'

                  echo "Installing Ansible deps in sidekiq..."
                  docker exec -u root proxysock-sidekiq bash -c "$INSTALL_CMD"
                  echo "✅ sidekiq done"

                  echo "Installing Ansible deps in web..."
                  docker exec -u root proxysock-web bash -c "$INSTALL_CMD"
                  echo "✅ web done"

        - name: Notify deployment
          if: always()
          run: |
              echo "🚀 Production deployment completed!"
              echo "API: ${{ env.REGISTRY }}/${{ env.API_IMAGE }}:latest"
              echo "Client: ${{ env.REGISTRY }}/${{ env.CLIENT_IMAGE }}:latest"
              echo "Commit: ${{ github.sha }}"
